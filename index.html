<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Orrery — Simulatore del Sistema Solare</title>
<style>
  :root{
    --bg:#04060b;
    --panel:rgba(11,16,26,.74);
    --panel-solid:#0b1019;
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.18);
    --txt:#e8ecf4;
    --txt-dim:#9aa5b8;
    --txt-faint:#636e82;
    --accent:#7fd1ff;
    --warm:#ffb470;
    --r:14px;
    --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* width/height espliciti: un elemento rimpiazzato con inset:0 e width:auto
     userebbe la dimensione intrinseca (il buffer di disegno), non la finestra */
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

  .panel{
    background:var(--panel);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:0 18px 50px -20px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .eyebrow{
    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-faint);
    font-weight:600;
  }

  /* ───────── top bar ───────── */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:flex-start;
    justify-content:space-between;gap:12px;padding:14px 16px;pointer-events:none}
  #topbar > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:9px 14px 9px 11px}
  .mark{width:26px;height:26px;border-radius:50%;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 36% 32%, #fff6e0 0%, #ffb347 42%, #e5761a 72%, #7a2d05 100%);
    box-shadow:0 0 16px 2px rgba(255,160,60,.5)}
  .mark::after{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1px solid rgba(127,209,255,.35);border-bottom-color:transparent;border-right-color:transparent;
    transform:rotate(-30deg)}
  .brand h1{margin:0;font-size:14px;font-weight:650;letter-spacing:.02em;line-height:1.15}
  .brand p{margin:1px 0 0;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-faint)}

  /* ───────── layers ───────── */
  #layers{width:212px;padding:11px 12px 9px;display:flex;flex-direction:column;gap:1px}
  #layers .eyebrow{margin:1px 2px 7px}
  .sw{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 7px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--txt-dim);
    transition:background .14s,color .14s;user-select:none}
  .sw:hover{background:rgba(255,255,255,.05);color:var(--txt)}
  .sw input{display:none}
  .sw .track{width:30px;height:17px;border-radius:9px;background:rgba(255,255,255,.1);
    position:relative;flex:0 0 auto;transition:background .18s;border:1px solid transparent}
  .sw .track::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
    background:#8b96a8;transition:transform .18s,background .18s}
  .sw input:checked + .track{background:rgba(127,209,255,.26);border-color:rgba(127,209,255,.4)}
  .sw input:checked + .track::after{transform:translateX(13px);background:var(--accent);
    box-shadow:0 0 8px rgba(127,209,255,.8)}
  .sw.on{color:var(--txt)}
  #layers hr{border:0;border-top:1px solid var(--line);margin:7px 2px}
  .selrow{display:flex;align-items:center;justify-content:space-between;padding:4px 7px 2px;
    font-size:12.5px;color:var(--txt-dim)}
  .selrow select{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid var(--line);
    border-radius:7px;padding:3px 6px;font:inherit;font-size:11.5px;outline:none;cursor:pointer}

  /* ───────── info panel ───────── */
  #info{position:fixed;left:16px;top:78px;width:286px;max-height:calc(100vh - 190px);z-index:25;
    padding:16px 17px 15px;overflow-y:auto;overscroll-behavior:contain;
    opacity:0;transform:translateX(-14px) scale(.985);pointer-events:none;
    transition:opacity .3s cubic-bezier(.22,1,.36,1),transform .34s cubic-bezier(.22,1,.36,1)}
  #info.show{opacity:1;transform:none;pointer-events:auto}
  #info::-webkit-scrollbar{width:4px}
  #info::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
  .ihead{display:flex;align-items:flex-start;gap:11px}
  .iswatch{width:34px;height:34px;border-radius:50%;flex:0 0 auto;margin-top:2px;
    box-shadow:inset -5px -4px 9px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.1)}
  #info h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.1}
  #info .kind{margin:3px 0 0;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
    font-weight:600}
  #iclose{position:absolute;top:10px;right:10px;width:24px;height:24px;border:0;border-radius:7px;
    background:transparent;color:var(--txt-faint);cursor:pointer;font-size:15px;line-height:1;
    display:grid;place-items:center;transition:background .14s,color .14s}
  #iclose:hover{background:rgba(255,255,255,.08);color:var(--txt)}
  .stats{margin:15px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:1px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}
  .stat{background:rgba(6,9,15,.55);padding:8px 9px}
  .stat dt{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt-faint);font-weight:600}
  .stat dd{margin:3px 0 0;font-size:13px;font-weight:550;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
  .stat dd small{font-size:10.5px;color:var(--txt-dim);font-weight:400}
  .note{margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--txt-dim)}
  .note b{color:var(--txt);font-weight:600}
  .moons{margin:14px 0 0}
  .moons .eyebrow{margin-bottom:7px}
  .mchips{display:flex;flex-wrap:wrap;gap:5px}
  .mchip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;
    padding:4px 10px;font-size:11.5px;color:var(--txt-dim);cursor:pointer;transition:all .14s}
  .mchip:hover{border-color:rgba(127,209,255,.45);color:var(--accent);background:rgba(127,209,255,.08)}
  .ilink{display:inline-flex;align-items:center;gap:7px;margin:15px 0 2px;padding:7px 12px;
    border-radius:9px;border:1px solid rgba(127,209,255,.3);background:rgba(127,209,255,.08);
    color:var(--accent);font-size:12px;font-weight:600;text-decoration:none;transition:all .14s}
  .ilink:hover{background:rgba(127,209,255,.17);border-color:rgba(127,209,255,.5)}
  .ilink[hidden]{display:none}
  .linkbtn{margin:6px 7px 2px;padding:0;border:0;background:none;color:var(--accent);
    font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;text-align:left;opacity:.85}
  .linkbtn:hover{opacity:1;text-decoration:underline}
  .mchip.off{opacity:.55}
  .rcol{display:flex;flex-direction:column;gap:9px;align-items:stretch}
  #nav{width:212px;max-height:calc(100vh - 475px);min-height:110px;overflow-y:auto;
    overscroll-behavior:contain;padding:10px 8px 9px}
  #nav::-webkit-scrollbar{width:4px}
  #nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
  #nav .eyebrow{margin:7px 6px 5px;position:sticky;top:-10px;
    background:linear-gradient(180deg,rgba(11,16,26,.97) 70%,transparent);padding:4px 0 3px}
  #nav .eyebrow:first-child{margin-top:0}
  .navb{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;border:0;
    border-radius:7px;background:none;color:var(--txt-dim);font:inherit;font-size:12.5px;
    text-align:left;cursor:pointer;transition:background .13s,color .13s}
  .navb:hover{background:rgba(255,255,255,.06);color:var(--txt)}
  .navb.sel{background:rgba(127,209,255,.14);color:var(--accent)}
  .navb i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.6)}
  .navb.pr i{border-radius:1px;transform:rotate(45deg);width:7px;height:7px;
    box-shadow:none;background:#7fd1ff}
  .navb.pr.dimdot i{background:#8d95a3}
  .lab.probe{font-size:9px;letter-spacing:.1em;color:rgba(150,216,255,.82)}
  .lab.probe .dot{width:4px;height:4px;transform:rotate(45deg);border-radius:1px}
  .lab.probe.dim{color:rgba(176,186,202,.6)}
  .magbox{margin:14px 0 0;padding:10px 11px;border-radius:9px;
    background:rgba(120,180,255,.07);border:1px solid rgba(120,180,255,.15)}
  .magbox .eyebrow{margin-bottom:5px;color:#86b7e0}
  .magbox p{margin:0;font-size:12px;line-height:1.5;color:var(--txt-dim)}
  .cmp{margin:13px 0 0;padding:9px 10px;border-radius:9px;background:rgba(127,209,255,.07);
    border:1px solid rgba(127,209,255,.16);font-size:11.5px;line-height:1.5;color:#bcd8ea}

  /* ───────── time bar ───────── */
  #timebar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:28;
    padding:10px 14px;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px)}
  .tdate{min-width:118px}
  .tdate .d{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .tdate .y{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-faint);
    margin-top:2px;font-weight:600}
  .tsep{width:1px;height:30px;background:var(--line);flex:0 0 auto}
  .tbtns{display:flex;gap:4px}
  .tb{width:32px;height:32px;border:1px solid transparent;border-radius:9px;background:rgba(255,255,255,.05);
    color:var(--txt-dim);cursor:pointer;display:grid;place-items:center;transition:all .14s;flex:0 0 auto}
  .tb:hover{background:rgba(255,255,255,.11);color:var(--txt)}
  .tb.play{background:rgba(127,209,255,.16);border-color:rgba(127,209,255,.34);color:var(--accent)}
  .tb svg{width:13px;height:13px;fill:currentColor}
  .tspeed{display:flex;flex-direction:column;gap:5px;min-width:150px}
  .tspeed .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tspeed .v{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;
    background:rgba(255,255,255,.14);outline:none;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 3px rgba(127,209,255,.2);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 3px rgba(127,209,255,.2);cursor:pointer}

  /* ───────── labels ───────── */
  #labels{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
    padding:3px 8px 3px 4px;border-radius:999px;cursor:pointer;pointer-events:auto;
    font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
    color:rgba(232,236,244,.82);white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 9px rgba(0,0,0,.85);
    transition:color .15s,background .15s,opacity .25s;will-change:transform}
  .lab:hover{color:#fff;background:rgba(255,255,255,.08)}
  .lab .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75;flex:0 0 auto;
    box-shadow:0 0 5px currentColor}
  .lab.sel{color:var(--accent);background:rgba(127,209,255,.12)}
  .lab.moon{font-size:9px;color:rgba(232,236,244,.5);letter-spacing:.09em}
  .lab.hidden{opacity:0;pointer-events:none}

  /* ───────── scale ruler ───────── */
  #ruler{position:fixed;left:16px;bottom:18px;z-index:20;pointer-events:none;
    font-size:10px;letter-spacing:.06em;color:var(--txt-faint);font-variant-numeric:tabular-nums}
  #ruler .bar{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong) 12%,var(--line-strong) 88%,transparent);
    margin-bottom:5px;position:relative}
  #ruler .bar::before,#ruler .bar::after{content:"";position:absolute;bottom:0;width:1px;height:5px;
    background:var(--line-strong)}
  #ruler .bar::before{left:0}#ruler .bar::after{right:0}

  /* ───────── hint ───────── */
  #hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:26;
    padding:9px 15px;font-size:11.5px;color:var(--txt-dim);display:flex;gap:16px;align-items:center;
    transition:opacity .5s;white-space:nowrap}
  #hint kbd{font:inherit;font-size:10px;font-weight:600;background:rgba(255,255,255,.09);
    border:1px solid var(--line);border-radius:5px;padding:2px 5px;color:var(--txt);margin-right:5px}
  #hint.gone{opacity:0;pointer-events:none}

  /* ───────── loader ───────── */
  #loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;
    transition:opacity .7s ease .15s;}
  #loader.gone{opacity:0;pointer-events:none}
  .ld{text-align:center;width:min(300px,78vw)}
  .ld .orb{width:52px;height:52px;margin:0 auto 22px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 30%, #fff8e8, #ffb347 40%, #d9690f 75%, #58200a 100%);
    box-shadow:0 0 36px 6px rgba(255,150,50,.35);animation:puls 2.6s ease-in-out infinite}
  @keyframes puls{0%,100%{box-shadow:0 0 30px 4px rgba(255,150,50,.3)}50%{box-shadow:0 0 46px 10px rgba(255,160,70,.45)}}
  .ld .orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;
    border:1px solid rgba(127,209,255,.25);border-top-color:rgba(127,209,255,.8);
    animation:spin 1.5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ld h2{margin:0 0 6px;font-size:16px;font-weight:650;letter-spacing:.01em}
  .ld p{margin:0 0 20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-faint);
    font-weight:600}
  .ld .track{height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
  .ld .fill{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#7fd1ff,#ffb470);
    transition:width .3s ease}
  .ld .st{margin:11px 0 0;font-size:10.5px;color:var(--txt-faint);height:13px;letter-spacing:.03em}

  /* ───────── mobile ───────── */
  #mtoggle{display:none}
  @media (max-width:820px){
    #topbar{padding:10px 11px}
    .brand{padding:7px 12px 7px 9px}
    .brand p{display:none}
    .rcol{position:fixed;top:60px;right:11px;width:196px;z-index:31;display:none}
    .rcol.open{display:flex}
    #layers{width:100%}
    #nav{width:100%;max-height:44vh}
    #mtoggle{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;
      border:1px solid var(--line);background:var(--panel);color:var(--txt-dim);cursor:pointer;
      -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
    #mtoggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
    #info{left:11px;right:11px;width:auto;top:auto;bottom:144px;max-height:38vh;
      transform:translateY(16px) scale(.985)}
    #info.show{transform:none}
    #timebar{left:11px;right:11px;bottom:11px;transform:none;flex-wrap:wrap;gap:10px;justify-content:center}
    .tspeed{min-width:130px;flex:1 1 130px}
    .tsep{display:none}
    #ruler{display:none}
    #hint{display:none}
    .lab.moon{display:none}
  }
  @media (max-width:420px){
    .tdate{min-width:0;flex:1 1 auto}
    .stats{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="labels"></div>

<header id="topbar">
  <div class="brand panel">
    <span class="mark"></span>
    <div><h1>Orrery</h1><p>Sistema Solare in scala</p></div>
  </div>
  <div style="display:flex;gap:9px;align-items:flex-start">
    <button id="mtoggle" aria-label="Livelli">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="rcol">
    <div id="layers" class="panel">
      <div class="eyebrow">Visualizzazione</div>
      <label class="sw on"><span>Orbite</span><input type="checkbox" id="t-orbits" checked><span class="track"></span></label>
      <label class="sw on"><span>Etichette</span><input type="checkbox" id="t-labels" checked><span class="track"></span></label>
      <label class="sw on"><span>Fascia asteroidi</span><input type="checkbox" id="t-belt" checked><span class="track"></span></label>
      <label class="sw"><span>Fascia di Kuiper</span><input type="checkbox" id="t-kuiper"><span class="track"></span></label>
      <label class="sw on"><span>Sonde spaziali</span><input type="checkbox" id="t-probes" checked><span class="track"></span></label>
      <label class="sw"><span>Vento solare e campi</span><input type="checkbox" id="t-wind"><span class="track"></span></label>
      <label class="sw on"><span>Via Lattea</span><input type="checkbox" id="t-milky" checked><span class="track"></span></label>
      <button id="b-probes" class="linkbtn">Elenco delle sonde →</button>
      <hr>
      <label class="sw"><span>Scala reale</span><input type="checkbox" id="t-real"><span class="track"></span></label>
      <div class="selrow"><span>Qualità</span>
        <select id="quality">
          <option value="high">Alta</option>
          <option value="med">Media</option>
          <option value="low">Bassa</option>
        </select>
      </div>
    </div>
    <nav id="nav" class="panel"><div id="nav-body"></div></nav>
    </div>
  </div>
</header>

<aside id="info" class="panel">
  <button id="iclose" aria-label="Chiudi">×</button>
  <div class="ihead">
    <span class="iswatch" id="i-swatch"></span>
    <div style="min-width:0">
      <h2 id="i-name">—</h2>
      <p class="kind" id="i-kind">—</p>
    </div>
  </div>
  <dl class="stats" id="i-stats"></dl>
  <div class="cmp" id="i-cmp"></div>
  <p class="note" id="i-note"></p>
  <div class="magbox" id="i-mag" hidden>
    <div class="eyebrow">Campo magnetico</div>
    <p id="i-magtxt"></p>
  </div>
  <div class="moons" id="i-moons" hidden>
    <div class="eyebrow">Satelliti naturali</div>
    <div class="mchips" id="i-mchips"></div>
  </div>
  <div class="moons" id="i-probelist" hidden>
    <div class="eyebrow" id="i-probelist-t">Sonde</div>
    <div class="mchips" id="i-pchips"></div>
  </div>
  <a id="i-link" class="ilink" target="_blank" rel="noopener" hidden>
    Foto e dati ufficiali
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
  </a>
</aside>

<footer id="timebar" class="panel">
  <div class="tdate">
    <div class="d" id="t-date">—</div>
    <div class="y" id="t-rel">—</div>
  </div>
  <div class="tsep"></div>
  <div class="tbtns">
    <button class="tb" id="b-back" title="Indietro"><svg viewBox="0 0 24 24"><path d="M11 12l9-7v14zM2 5h3v14H2z"/></svg></button>
    <button class="tb play" id="b-play" title="Pausa / Riproduci"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <button class="tb" id="b-fwd" title="Avanti"><svg viewBox="0 0 24 24"><path d="M13 12L4 5v14zM19 5h3v14h-3z"/></svg></button>
    <button class="tb" id="b-now" title="Torna a oggi"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9h-2a7 7 0 11-7-7V3z"/><path d="M12 7v6l4 2-.9 1.7L10.4 14V7z"/></svg></button>
  </div>
  <div class="tsep"></div>
  <div class="tspeed">
    <div class="lbl"><span class="eyebrow">Velocità</span><span class="v" id="t-speed">1 g/s</span></div>
    <input type="range" id="t-slider" min="0" max="100" value="38">
  </div>
</footer>

<div id="ruler"><div class="bar" style="width:120px"></div><span id="ruler-t">—</span></div>

<div id="hint" class="panel">
  <span><kbd>Trascina</kbd>ruota</span>
  <span><kbd>Rotella</kbd>zoom</span>
  <span><kbd>Clic</kbd>seleziona un corpo</span>
</div>

/* ════════════════════════════════════════════════════════════════════
   3. MECCANICA ORBITALE — equazione di Kepler
   ════════════════════════════════════════════════════════════════════ */

// Risolve l'equazione di Kepler  M = E − e·sin E  con Newton-Raphson,
// poi converte in coordinate eclittiche cartesiane (in UA).
const _v3 = new THREE.Vector3();
function orbitalPos(el, days, out = _v3) {
  const M = ((el.M0 + (360 / el.P) * days) % 360 + 360) % 360 * DEG;
  const e = el.e;
  let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));   // stima iniziale
  for (let k = 0; k < 8; k++) {
    const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= d;
    if (Math.abs(d) < 1e-12) break;
  }
  const xv = el.a * (Math.cos(E) - e);
  const yv = el.a * Math.sqrt(1 - e * e) * Math.sin(E);
  const r  = Math.hypot(xv, yv);
  const v  = Math.atan2(yv, xv);
  const O = el.O * DEG, w = el.w * DEG, i = el.i * DEG;
  const vw = v + w, cvw = Math.cos(vw), svw = Math.sin(vw);
  const cO = Math.cos(O), sO = Math.sin(O), ci = Math.cos(i), si = Math.sin(i);
  // eclittica → scena (y verticale)
  return out.set(
     r * (cO * cvw - sO * svw * ci) * AU,
     r * (svw * si) * AU,
    -r * (sO * cvw + cO * svw * ci) * AU
  );
}

/* ════════════════════════════════════════════════════════════════════
   4. RUMORE PROCEDURALE (CPU) — per le texture
   ════════════════════════════════════════════════════════════════════ */

function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = hash3(xi, yi, zi),         c100 = hash3(xi + 1, yi, zi);
  const c010 = hash3(xi, yi + 1, zi),     c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1),     c101 = hash3(xi + 1, yi, zi + 1);
  const c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
  const x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}
function fbm(x, y, z, oct = 5, lac = 2.03, gain = 0.5) {
  let a = 1, s = 0, n = 0;
  for (let k = 0; k < oct; k++) { s += a * vnoise(x, y, z); n += a; x *= lac; y *= lac; z *= lac; a *= gain; }
  return s / n;
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth  = (a, b, t) => { t = clamp01((t - a) / (b - a)); return t * t * (3 - 2 * t); };

  [[-85,22],[-75,20],[-77,23],[-84,23]],
  [[-59,47],[-53,47],[-55,51],[-58,49]]
];

// Antartide: una calotta che gira tutto attorno al polo, con la penisola
const ANTARCTICA = (() => {
  const pts = [];
  for (let lon = -180; lon <= 180; lon += 10) {
    let lat = -70 + 4.5 * Math.sin(lon * DEG * 2.3) + 2.5 * Math.cos(lon * DEG * 1.3);
    if (lon > -75 && lon < -55) lat = -64 - Math.abs(lon + 65) * 0.4;   // penisola
    pts.push([lon, lat]);
  }
  pts.push([180, -90], [-180, -90]);
  return pts;
})();

// canale rosso = terraferma, canale verde = ghiaccio permanente
function landMask(W) {
  const H = W >> 1;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  const X = lon => (lon + 180) / 360 * W, Y = lat => (90 - lat) / 180 * H;
  const draw = (poly, style) => {
    x.fillStyle = style;
    for (const off of [-W, 0, W]) {
      x.beginPath();
      poly.forEach(([lo, la], k) => k ? x.lineTo(X(lo) + off, Y(la)) : x.moveTo(X(lo) + off, Y(la)));
      x.closePath(); x.fill();
    }
  };
  for (const poly of WORLD) draw(poly, 'rgb(255,0,0)');
  draw(ANTARCTICA, 'rgb(255,255,0)');                       // terra + ghiaccio
  draw(WORLD[5], 'rgb(255,255,0)');                         // Groenlandia
  // sfumatura: senza, la costa resta il bordo netto del poligono e il
  // rumore non ha margine per frastagliarla
  x.globalCompositeOperation = 'copy';
  x.filter = 'blur(' + Math.max(2, Math.round(W / 150)) + 'px)';
  x.drawImage(cv, 0, 0);
  x.filter = 'none';
  x.globalCompositeOperation = 'source-over';
  return x.getImageData(0, 0, W, H).data;
}

/* ════════════════════════════════════════════════════════════════════
   5. PALETTE E GENERAZIONE DELLE TEXTURE
   ════════════════════════════════════════════════════════════════════ */

// Ogni palette è una lista di stop [posizione, r, g, b].
const PALETTES = {
  mercury:  [[0,52,48,44],[.35,112,104,95],[.6,150,142,130],[.82,181,173,160],[1,208,201,189]],
  venus:    [[0,120,88,38],[.35,197,160,86],[.62,233,205,142],[.85,247,231,183],[1,255,246,214]],
  mars:     [[0,70,32,20],[.3,128,60,34],[.52,166,86,48],[.72,196,116,72],[.88,219,160,112],[1,238,210,186]],
  moon:     [[0,42,40,38],[.33,92,88,84],[.58,134,129,122],[.8,172,167,158],[1,205,200,191]],
  ceres:    [[0,38,35,32],[.4,78,73,67],[.7,118,112,104],[1,152,146,137]],
  vesta:    [[0,44,40,37],[.4,92,86,80],[.72,134,126,118],[1,170,162,152]],
  jupiter:  [[0,88,58,36],[.18,142,98,62],[.34,186,140,96],[.5,222,186,142],[.66,240,214,176],[.82,250,236,210],[1,255,248,232]],
  saturn:   [[0,118,92,50],[.25,172,142,88],[.48,212,186,128],[.7,238,217,167],[.88,250,237,203],[1,255,248,226]],
  uranus:   [[0,78,146,156],[.35,126,196,208],[.62,168,224,232],[.84,200,240,244],[1,222,249,251]],
  neptune:  [[0,24,52,112],[.3,42,86,172],[.56,66,122,214],[.78,110,164,236],[1,168,206,248]],
  pluto:    [[0,58,44,36],[.3,112,90,74],[.55,168,142,116],[.78,214,192,164],[1,240,228,208]],
  io:       [[0,92,64,16],[.28,164,122,28],[.5,214,178,54],[.7,240,214,104],[.86,228,160,60],[1,250,236,170]],
  europa:   [[0,146,128,112],[.3,198,182,166],[.58,228,218,206],[.82,242,236,228],[1,252,250,246]],
  ganymede: [[0,58,54,50],[.32,104,99,94],[.58,146,141,134],[.8,182,177,169],[1,212,208,200]],
  callisto: [[0,40,36,33],[.35,84,77,70],[.65,124,116,106],[1,160,152,142]],
  titan:    [[0,122,70,22],[.35,180,118,42],[.62,222,166,76],[.85,240,200,122],[1,250,224,166]],
  enceladus:[[0,168,172,178],[.35,214,218,224],[.65,238,241,245],[1,253,254,255]],
  triton:   [[0,138,118,118],[.32,186,166,164],[.6,218,202,200],[.84,238,228,226],[1,250,246,245]]
};

function rampColor(pal, t) {
  t = clamp01(t);
  const s = PALETTES[pal] || PALETTES.moon;
  for (let k = 1; k < s.length; k++) {
    if (t <= s[k][0]) {
      const a = s[k - 1], b = s[k];
      const f = (t - a[0]) / (b[0] - a[0] || 1);
      return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f];
    }
  }
  const l = s[s.length - 1]; return [l[1], l[2], l[3]];
}

// Genera colore + bump (+ rugosità) campionando rumore 3D sulla sfera unitaria:
// nessuna cucitura in longitudine e nessuna distorsione ai poli.
function beginSurface(opts) {
  const W = opts.w, H = W >> 1;
  const mkCanvas = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const st = { W, H, opts };
  st.cv = mkCanvas(); st.ctx = st.cv.getContext('2d');
  st.img = st.ctx.createImageData(W, H); st.px = st.img.data;
  st.bv = mkCanvas(); st.bctx = st.bv.getContext('2d');
  st.bimg = st.bctx.createImageData(W, H); st.bpx = st.bimg.data;
  if (opts.roughMap) {
    st.rv = mkCanvas(); st.rctx = st.rv.getContext('2d');
    st.rimg = st.rctx.createImageData(W, H); st.rpx = st.rimg.data;
  }
  if (opts.nightMap) {
    st.nv = mkCanvas(); st.nctx = st.nv.getContext('2d');
    st.nimg = st.nctx.createImageData(W, H); st.npx = st.nimg.data;
  }
  if (opts.type === 'earth') st.mask = landMask(W);
  return st;
}

// Riempie solo le righe [j0, j1): la generazione può così essere spezzata su
// più frame, e una texture grande non blocca la pagina.
function surfaceRows(st, j0, j1) {
  const W = st.W, H = st.H, opts = st.opts, px = st.px, bpx = st.bpx;
  const rpx = st.rpx || null, npx = st.npx || null, mask = st.mask || null;
  const seed = opts.seed || 0;
  const F = opts.freq || 2.4;
  const oct = opts.oct || 5;
  const sx = opts.stretch ? 1 / opts.stretch : 1;   // bande: compressione in longitudine

  for (let j = j0; j < j1; j++) {
    const lat = (0.5 - (j + 0.5) / H) * Math.PI;
    const cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < W; i++) {
      const lon = ((i + 0.5) / W) * Math.PI * 2;
      const dx = cl * Math.cos(lon), dy = sl, dz = cl * Math.sin(lon);
      let h, t, rough = 0.8, isLand = false;

      if (opts.type === 'bands') {
        // bande latitudinali irregolari + turbolenza stirata in longitudine
        const bands = Math.sin(lat * (opts.bandFreq || 15) + fbm(dx * 1.2 + seed, dy * 4, dz * 1.2, 3) * 3.4);
        const turb  = fbm(dx * F * sx + seed, dy * F * (opts.latFreq || 7), dz * F * sx, oct);
        h = clamp01(0.5 + bands * (opts.bandAmp ?? 0.26) + (turb - 0.5) * (opts.turbAmp ?? 0.6));
        t = h;
      } else if (opts.type === 'earth') {
        const mo = (j * W + i) * 4;
        const cont = mask[mo] / 255;              // contorni geografici veri
        const perma = mask[mo + 1] / 255;         // calotte permanenti
        // il rumore sfrangia la costa, così il poligono non si vede
        const det  = fbm(dx * 30 + seed, dy * 30, dz * 30, 4);
        const med  = fbm(dx * 9 + seed, dy * 9, dz * 9, 4);
        const land = cont * 0.70 + 0.15 + (det - 0.5) * 0.26 + (med - 0.5) * 0.22;
        if (land < 0.5) {                         // oceano
          const d = smooth(0.08, 0.5, land);
          const r = 9 + d * 20, g = 32 + d * 62, b = 76 + d * 92;
          h = 0.30; t = -1; rough = 0.42;
          px[(j * W + i) * 4] = r; px[(j * W + i) * 4 + 1] = g; px[(j * W + i) * 4 + 2] = b;
        } else {
          const el = smooth(0.5, 0.95, land) * 0.55
                   + smooth(0.35, 0.80, fbm(dx * 3.5 + 19, dy * 3.5, dz * 3.5, 5)) * 0.45;
          // fascia desertica stretta attorno ai 25° di latitudine, e solo dove
          // anche il rumore è d'accordo: altrimenti tutte le terre sono Sahara
          const dry  = smooth(0.10, 0.30, Math.abs(Math.abs(lat) - 0.45));
          const arid = clamp01(1 - dry) * smooth(0.55, 0.82, fbm(dx * 4 + 7, dy * 4, dz * 4, 3));
          const cold = smooth(0.84, 1.24, Math.abs(lat));            // tundra
          const veg  = fbm(dx * 7 + 13, dy * 7, dz * 7, 4) - 0.5;    // macchie di vegetazione
          let r = 60 + el * 46, g = 72 + el * 26, b = 44 + el * 16;
          r += veg * -22; g += veg * 26; b += veg * -8;
          r += arid * 118; g += arid * 76; b += arid * 20;
          r += cold * 30;  g += cold * 12; b += cold * 16;
          if (el > 0.84) { const s2 = smooth(0.84, 1.0, el); r += s2 * 78; g += s2 * 84; b += s2 * 88; }
          h = 0.5 + el * 0.5; t = -1; rough = 0.95; isLand = true;
          px[(j * W + i) * 4] = r; px[(j * W + i) * 4 + 1] = g; px[(j * W + i) * 4 + 2] = b;
        }
        // calotte polari: per latitudine più Groenlandia e Antartide
        const ice = Math.max(
          smooth(1.30, 1.49, Math.abs(lat) + (fbm(dx * 7 + 3, dy * 7, dz * 7, 3) - 0.5) * 0.13),
          clamp01(mask[mo + 1] / 255 * 1.25 + (fbm(dx * 9 + 5, dy * 9, dz * 9, 3) - 0.5) * 0.3));
        if (ice > 0) {
          const o = (j * W + i) * 4;
          px[o]     = px[o]     + (246 - px[o])     * ice;
          px[o + 1] = px[o + 1] + (250 - px[o + 1]) * ice;
          px[o + 2] = px[o + 2] + (255 - px[o + 2]) * ice;
          h = Math.max(h, 0.55 + ice * 0.2); rough = rough + (0.55 - rough) * ice;
        }
      } else if (opts.type === 'blotch') {
        const n1 = fbm(dx * 3.1 + seed, dy * 3.1, dz * 3.1, 4);
        const n2 = fbm(dx * 11 + seed, dy * 11, dz * 11, 3);
        h = clamp01(n1 * 0.76 + n2 * 0.24);
        t = clamp01(h + (n2 - 0.5) * 0.3);
      } else if (opts.type === 'smooth') {
        h = fbm(dx * 1.7 + seed, dy * 1.7, dz * 1.7, 4);
        t = 0.35 + h * 0.55;
      } else {                                     // 'rock' generico
        const n1 = fbm(dx * F + seed, dy * F, dz * F, oct);
        const n2 = fbm(dx * F * 4.3 + seed, dy * F * 4.3, dz * F * 4.3, 3);
        h = clamp01(n1 * 0.72 + n2 * 0.28);
        t = h;
      }

      const o = (j * W + i) * 4;
      if (t >= 0) {
        const c = rampColor(opts.pal, t);
        px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2];
      }
      px[o + 3] = 255;
      const bb = (h * 255) | 0;
      bpx[o] = bb; bpx[o + 1] = bb; bpx[o + 2] = bb; bpx[o + 3] = 255;
      if (rpx) { const rr = (rough * 255) | 0; rpx[o] = rr; rpx[o + 1] = rr; rpx[o + 2] = rr; rpx[o + 3] = 255; }
      if (npx) {
        // luci delle città: solo sulla terraferma, in grappoli, assenti ai poli
        let v = 0;
        if (isLand) {
          const cluster = fbm(dx * 9 + 31, dy * 9, dz * 9, 4);
          const grain   = fbm(dx * 40 + 57, dy * 40, dz * 40, 3);
          v = smooth(0.52, 0.86, cluster) * smooth(0.50, 0.90, grain);
          v *= 1 - smooth(1.02, 1.32, Math.abs(lat));
        }
        const nn = clamp01(v) * 255;
        npx[o] = nn; npx[o + 1] = nn * 0.78; npx[o + 2] = nn * 0.48; npx[o + 3] = 255;
      }
    }
  }
}

function finishSurface(st) {
  const W = st.W, H = st.H, opts = st.opts, ctx = st.ctx, bctx = st.bctx;
  ctx.putImageData(st.img, 0, 0);
  bctx.putImageData(st.bimg, 0, 0);
  if (st.rpx) st.rctx.putImageData(st.rimg, 0, 0);
  if (st.npx) st.nctx.putImageData(st.nimg, 0, 0);
  const cv = st.cv, bv = st.bv, rv = st.rv;

  // ── dettagli disegnati sopra ──────────────────────────────────────
  const rnd = mulberry(opts.seed * 7919 + 13);

  if (opts.craters) {
    for (let k = 0; k < opts.craters; k++) {
      const lat = (rnd() - 0.5) * 2.5;
      const x = rnd() * W, y = (0.5 - lat / Math.PI) * H;
      const base = (4 + Math.pow(rnd(), 3.2) * 0.085 * W);
      const wx = base / Math.max(0.18, Math.cos(lat));
      for (const ox of [-W, 0, W]) {
        ctx.save(); ctx.translate(x + ox, y); ctx.scale(wx / base, 1);
        const g = ctx.createRadialGradient(0, 0, base * 0.18, 0, 0, base);
        g.addColorStop(0,   'rgba(0,0,0,.30)');
        g.addColorStop(.62, 'rgba(0,0,0,.12)');
        g.addColorStop(.82, 'rgba(255,255,255,.17)');
        g.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, base, 0, 7); ctx.fill();
        ctx.restore();
        bctx.save(); bctx.translate(x + ox, y); bctx.scale(wx / base, 1);
        const gb = bctx.createRadialGradient(0, 0, base * 0.18, 0, 0, base);
        gb.addColorStop(0, 'rgba(0,0,0,.55)'); gb.addColorStop(.7, 'rgba(0,0,0,.2)');
        gb.addColorStop(.85, 'rgba(255,255,255,.4)'); gb.addColorStop(1, 'rgba(255,255,255,0)');
        bctx.fillStyle = gb; bctx.beginPath(); bctx.arc(0, 0, base, 0, 7); bctx.fill();
        bctx.restore();
      }
    }
  }

  if (opts.cracks) {
    ctx.lineCap = 'round';
    for (let k = 0; k < opts.cracks; k++) {
      let x = rnd() * W, y = rnd() * H;
      let ang = rnd() * 7;
      ctx.beginPath(); ctx.moveTo(x, y);
      const steps = 24 + (rnd() * 46) | 0;
      for (let s = 0; s < steps; s++) {
        ang += (rnd() - 0.5) * 0.55;
        x += Math.cos(ang) * (W / 150); y += Math.sin(ang) * (W / 190);
        ctx.lineTo(x, y);
      }
      ctx.strokeStyle = opts.crackColor || 'rgba(120,70,50,.42)';
      ctx.lineWidth = Math.max(0.7, (W / 760) * (0.5 + rnd() * 1.7));
      ctx.stroke();
    }
  }

  if (opts.grooves) {
    for (let k = 0; k < opts.grooves; k++) {
      const y = rnd() * H, len = W * (0.1 + rnd() * 0.45), x = rnd() * W;
      const bend = (rnd() - 0.5) * H * 0.12;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + len / 2, y + bend, x + len, y + bend * 0.4);
      ctx.strokeStyle = rnd() > 0.5 ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.14)';
      ctx.lineWidth = Math.max(0.8, (W / 620) * (0.6 + rnd() * 1.5));
      ctx.stroke();
    }
  }

  if (opts.spot) {   // Grande Macchia Rossa & co.
    const { lat, lonFrac, rw, rh, color } = opts.spot;
    const y = (0.5 - lat / 180) * H, x = lonFrac * W;
    for (const ox of [-W, 0, W]) {
      ctx.save(); ctx.translate(x + ox, y); ctx.scale(rw * W, rh * H);
      const g = ctx.createRadialGradient(0, 0, 0.2, 0, 0, 1);
      g.addColorStop(0, color[0]); g.addColorStop(.55, color[1]); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.fill(); ctx.restore();
    }
  }

  const mk = (canvas, srgb) => {
    const t = new THREE.CanvasTexture(canvas);
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.wrapS = THREE.RepeatWrapping;
    t.anisotropy = 4;
    return t;
  };
  return { map: mk(cv, true), bump: mk(bv, false),
           rough: rv ? mk(rv, false) : null,
           night: st.nv ? mk(st.nv, true) : null };
}

function makeSurface(opts) {
  const st = beginSurface(opts);
  surfaceRows(st, 0, st.H);
  return finishSurface(st);
}

// Cede il controllo al browser fra una fascia e l'altra: serve a rigenerare
// una texture al doppio della risoluzione senza far scattare l'animazione.
async function makeSurfaceAsync(opts, rowsPerChunk = 16) {
  const st = beginSurface(opts);
  for (let j = 0; j < st.H; j += rowsPerChunk) {
    surfaceRows(st, j, Math.min(j + rowsPerChunk, st.H));
    await new Promise(r => requestAnimationFrame(r));
  }
  return finishSurface(st);
}

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function beginClouds(W) {
  const H = W >> 1;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  return { W, H, cv, ctx, img, px: img.data };
}

function cloudRows(st, j0, j1) {
  const W = st.W, H = st.H, px = st.px;
  for (let j = j0; j < j1; j++) {
    const lat = (0.5 - (j + 0.5) / H) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    // più nubi all'equatore (convergenza intertropicale) e alle medie latitudini
    const zonal = 0.30 + 0.26 * Math.cos(lat * 6.0) * Math.cos(lat);
    for (let i = 0; i < W; i++) {
      const lon = ((i + 0.5) / W) * Math.PI * 2;
      const dx = cl * Math.cos(lon), dy = sl, dz = cl * Math.sin(lon);
      const n = fbm(dx * 3.4 + 21, dy * 5.2, dz * 3.4, 6);
      const a = clamp01((n - (1 - zonal)) * 2.6);
      const o = (j * W + i) * 4;
      px[o] = px[o + 1] = px[o + 2] = 255;
      px[o + 3] = (clamp01(a) * 215) | 0;
    }
  }
}

function finishClouds(st) {
  st.ctx.putImageData(st.img, 0, 0);
  const t = new THREE.CanvasTexture(st.cv);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}

function makeClouds(W) {
  const st = beginClouds(W);
  cloudRows(st, 0, st.H);
  return finishClouds(st);
}

async function makeCloudsAsync(W, rowsPerChunk = 16) {
  const st = beginClouds(W);
  for (let j = 0; j < st.H; j += rowsPerChunk) {
    cloudRows(st, j, Math.min(j + rowsPerChunk, st.H));
    await new Promise(r => requestAnimationFrame(r));
  }
  return finishClouds(st);
}

/* ════════════════════════════════════════════════════════════════════
   6. SHADER
   ════════════════════════════════════════════════════════════════════ */

const GLSL_NOISE = `
float h31(vec3 p){ p=fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n31(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm3(vec3 p, int o){ float a=.5,s=0.,n=0.; for(int k=0;k<8;k++){ if(k>=o)break; s+=a*n31(p); n+=a; p*=2.03; a*=.5;} return s/n; }
`;

const sunMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    #include <common>
    #include <logdepthbuf_pars_vertex>
    varying vec3 vP; varying vec3 vN; varying vec3 vW;
    void main(){ vP=position; vN=normalize(mat3(modelMatrix)*normal);
      vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: GLSL_NOISE + `
    #include <common>
    #include <logdepthbuf_pars_fragment>
    uniform float uTime; varying vec3 vP; varying vec3 vN; varying vec3 vW;
    void main(){
      #include <logdepthbuf_fragment>
      vec3 p = normalize(vP);
      float t = uTime;
      // buchi coronali: ampie zone scure a lenta deriva
      float holes = fbm3(p*3.0  + vec3(0.0, t*0.004, 0.0), 4);
      // rete magnetica della cromosfera e granulazione fine
      float net   = fbm3(p*13.0 + vec3(t*0.007), 5);
      float fine  = fbm3(p*44.0 - vec3(t*0.013), 4);
      // regioni attive: rare, concentrate, incandescenti
      float arN   = fbm3(p*5.0  + vec3(11.0, t*0.003, 0.0), 4);
      float ar    = pow(smoothstep(0.57, 0.86, arN), 1.6);
      float fib   = pow(smoothstep(0.44, 0.95, fbm3(p*72.0 + vec3(3.0) - vec3(t*0.02), 3)), 1.3);

      // rumore "a cresta": dà i filamenti sottili al posto delle macchie tonde
      float ridge = 1.0 - abs(2.0*fbm3(p*30.0 + vec3(5.0, t*0.010, 0.0), 4) - 1.0);
      float h = 0.14 + 0.44*net + 0.28*fine + 0.11*pow(ridge, 3.0);
      h *= mix(0.16, 1.0, smoothstep(0.33, 0.67, holes));
      h += ar * (0.45 + 0.80*fib + 0.75*pow(ridge, 2.0));

      // palette tarata sul falso colore di SDO: disco quasi bruno,
      // regioni attive che saltano fuori di due ordini di grandezza
      vec3 c0 = vec3(0.010, 0.0025, 0.0006);
      vec3 c1 = vec3(0.080, 0.020,  0.0035);
      vec3 c2 = vec3(0.330, 0.092,  0.0090);
      vec3 c3 = vec3(0.950, 0.420,  0.0450);
      vec3 c4 = vec3(1.000, 0.880,  0.4500);
      vec3 col = mix(c0, c1, smoothstep(0.02, 0.26, h));
      col = mix(col, c2, smoothstep(0.26, 0.60, h));
      col = mix(col, c3, smoothstep(0.60, 0.90, h));
      col = mix(col, c4, smoothstep(0.90, 1.24, h));

      // brillamento che vaga lentamente sulla superficie
      vec3 fdir = normalize(vec3(sin(t*0.011), 0.42*sin(t*0.0075), cos(t*0.011)));
      float flare = smoothstep(0.978, 0.9995, dot(p, fdir)) * (0.55 + 0.9*fib);
      col += vec3(1.0, 0.90, 0.68) * flare * 2.2;

      // in ultravioletto il bordo è più luminoso del centro, non più scuro:
      // la linea di vista attraversa uno strato più spesso di plasma caldo
      float f = clamp(dot(normalize(vN), normalize(cameraPosition - vW)), 0.0, 1.0);
      float limb = pow(1.0 - f, 3.4);
      col = col * mix(1.0, 1.9, limb) + vec3(1.0, 0.42, 0.06) * limb * 1.15;
      gl_FragColor = vec4(col, 1.0);
    }`
});

function atmoMaterial(color, power = 3.2, intensity = 1.0, sunset = 0.0) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uPow: { value: power }, uInt: { value: intensity },
      uSunset: { value: sunset },
      uSun: { value: new THREE.Vector3(0, 0, 0) }
    },
    vertexShader: `
      #include <common>
      #include <logdepthbuf_pars_vertex>
      varying vec3 vN; varying vec3 vW;
      void main(){ vN=normalize(mat3(modelMatrix)*normal);
        vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz;
        gl_Position=projectionMatrix*viewMatrix*w;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      uniform vec3 uColor; uniform float uPow; uniform float uInt;
      uniform float uSunset; uniform vec3 uSun;
      varying vec3 vN; varying vec3 vW;
      void main(){
        #include <logdepthbuf_fragment>
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vW);
        vec3 L = normalize(uSun - vW);
        float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), uPow);
        float lit = clamp(dot(N, L) * 1.15 + 0.10, 0.0, 1.0);
        // dove la luce attraversa l'atmosfera di taglio il cammino e' piu' lungo
        // e lo scattering lascia passare i rossi: e' l'alba vista dallo spazio
        float graze = pow(1.0 - abs(dot(N, L)), 7.0);
        vec3 col = mix(uColor, vec3(1.7, 0.62, 0.30), graze * uSunset);
        float a = rim * lit * uInt;
        gl_FragColor = vec4(col * a, a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.FrontSide
  });
}

const coronaMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uLimb: { value: 0.33 } },
  vertexShader: `
    #include <common>
    #include <logdepthbuf_pars_vertex>
    varying vec2 vUv; void main(){ vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    #include <logdepthbuf_vertex>
  }`,
  fragmentShader: GLSL_NOISE + `
    #include <common>
    #include <logdepthbuf_pars_fragment>
    uniform float uTime; uniform float uLimb; varying vec2 vUv;
    void main(){
      #include <logdepthbuf_fragment>
      vec2 d = vUv-0.5; float r = length(d)*2.0;
      if(r>1.0) discard;
      float ang = atan(d.y, d.x);
      vec3 ap = vec3(cos(ang), sin(ang), 0.0);
      // archi coronali: lunghezze diverse a seconda dell'angolo
      float arc  = fbm3(ap*3.0 + vec3(0.0,0.0,uTime*0.012), 4);
      float fine = fbm3(ap*11.0 + vec3(7.0,0.0,uTime*0.02), 3);
      float out_ = max(0.0, r - uLimb);
      float ring  = exp(-pow((r-uLimb)/0.020, 2.0));
      float loops = exp(-out_/(0.045 + 0.10*arc*arc)) * (0.30 + 1.0*fine);
      float halo  = exp(-out_/0.40) * 0.11;
      float a = ring*0.85 + loops*0.60 + halo;
      a *= smoothstep(uLimb-0.045, uLimb-0.004, r);   // niente velo sul disco
      vec3 col = mix(vec3(1.0,0.86,0.42), vec3(1.0,0.34,0.04), smoothstep(0.0,0.30,out_));
      gl_FragColor = vec4(col*a*1.25, a);
    }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});

function ringMaterial(inner, outer, variant) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uIn: { value: inner }, uOut: { value: outer },
      uSun: { value: new THREE.Vector3() },
      uCenter: { value: new THREE.Vector3() }, uRadius: { value: 1 },
      uFaint: { value: variant === 'faint' ? 1.0 : 0.0 }
    },
    vertexShader: `
      #include <common>
      #include <logdepthbuf_pars_vertex>
      varying vec3 vLocal; varying vec3 vW; varying vec3 vN;
      void main(){ vLocal=position; vN=normalize(mat3(modelMatrix)*normal);
        vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz;
        gl_Position=projectionMatrix*viewMatrix*w;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: GLSL_NOISE + `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      uniform float uIn; uniform float uOut; uniform vec3 uSun; uniform float uFaint;
      uniform vec3 uCenter; uniform float uRadius;
      varying vec3 vLocal; varying vec3 vW; varying vec3 vN;
      void main(){
        #include <logdepthbuf_fragment>
        float r = length(vLocal.xy);
        float t = (r-uIn)/(uOut-uIn);
        if(t<0.0||t>1.0) discard;
        // divisioni e bande: la Cassini è il vuoto marcato a t≈0.60
        float f1 = fbm3(vec3(t*24.0, 1.7, 4.3), 5);
        float f2 = fbm3(vec3(t*88.0, 8.1, 2.2), 3);
        float band = clamp(0.14 + 1.35*f1*f1 + 0.28*f2 - 0.16*sin(t*205.0), 0.0, 1.25);
        float cassini  = smoothstep(0.012,0.055,abs(t-0.605));
        float encke    = smoothstep(0.004,0.016,abs(t-0.905));
        float innerFade= smoothstep(0.0,0.10,t);
        float outerFade= 1.0-smoothstep(0.90,1.0,t);
        float dens = band*cassini*encke*innerFade*outerFade;
        dens = clamp(dens,0.0,1.0);
        vec3 col = mix(vec3(0.52,0.44,0.34), vec3(0.95,0.89,0.76), clamp(band,0.0,1.0));
        float lit = clamp(abs(dot(normalize(vN), normalize(uSun-vW)))*1.1+0.15, 0.0, 1.0);
        // ombra del pianeta proiettata sugli anelli
        vec3 D = vW - uSun; float L = length(D); vec3 dn = D/L;
        float tc = dot(uCenter - uSun, dn);
        float shadow = 1.0;
        if(tc > 0.0 && tc < L){
          float perp = length((uSun + dn*tc) - uCenter);
          shadow = smoothstep(uRadius*0.94, uRadius*1.08, perp);
        }
        lit *= mix(0.12, 1.0, shadow);
        float a = dens * mix(0.60, 0.12, uFaint);
        gl_FragColor = vec4(col*lit*mix(0.98,0.78,uFaint), a);
      }`,
    transparent: true, side: THREE.DoubleSide, depthWrite: false
  });
}

function makeStars(count) {
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3), siz = new Float32Array(count);
  const rnd = mulberry(4242);
  const R = 5e5;
  for (let k = 0; k < count; k++) {
    // densità concentrata verso il piano galattico
    let b;
    do { b = (rnd() + rnd() + rnd() + rnd() - 2) * 0.62; } while (Math.abs(b) > 1.5);
    const l = rnd() * Math.PI * 2;
    const cb = Math.cos(b), sb = Math.sin(b);
    const gx = cb * Math.cos(l), gy = sb, gz = cb * Math.sin(l);
    const v = new THREE.Vector3(gx, gy, gz)
      .applyAxisAngle(new THREE.Vector3(0, 1, 0), 96 * DEG)
      .applyAxisAngle(new THREE.Vector3(0, 0, 1), 60.2 * DEG).multiplyScalar(R);
    pos[k * 3] = v.x; pos[k * 3 + 1] = v.y; pos[k * 3 + 2] = v.z;
    // temperatura di colore
    const u = rnd();
    let r, g, bl;
    if (u < 0.08)      { r = 0.70; g = 0.80; bl = 1.00; }   // blu
    else if (u < 0.28) { r = 0.90; g = 0.94; bl = 1.00; }   // bianco-blu
    else if (u < 0.58) { r = 1.00; g = 0.98; bl = 0.92; }   // bianco
    else if (u < 0.82) { r = 1.00; g = 0.90; bl = 0.72; }   // giallo
    else               { r = 1.00; g = 0.76; bl = 0.56; }   // arancio-rosso
    const mag = 0.30 + Math.pow(rnd(), 3.6) * 1.9;
    col[k * 3] = r * mag; col[k * 3 + 1] = g * mag; col[k * 3 + 2] = bl * mag;
    siz[k] = 0.8 + Math.pow(rnd(), 5.0) * 3.4;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uDpr: { value: 1 } },
    vertexShader: `
      #include <common>
      #include <logdepthbuf_pars_vertex>
      attribute vec3 aColor; attribute float aSize; uniform float uDpr;
      varying vec3 vC;
      void main(){ vC=aColor;
        gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);
        gl_PointSize = aSize*uDpr;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      varying vec3 vC;
      void main(){
        #include <logdepthbuf_fragment>
        vec2 d = gl_PointCoord-0.5; float r = length(d)*2.0;
        float a = exp(-r*r*3.4);
        if(a<0.01) discard;
        gl_FragColor = vec4(vC*a, a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true
  });
  const p = new THREE.Points(geo, mat);
  p.renderOrder = -1; p.frustumCulled = false;
  return p;
}

function makeBelt(cfg) {
  const n = cfg.count;
  const pos = new Float32Array(n * 3);   // placeholder
  const aA = new Float32Array(n), aPh = new Float32Array(n),
        aIn = new Float32Array(n), aNo = new Float32Array(n),
        aSz = new Float32Array(n), aEc = new Float32Array(n);
  const col = new Float32Array(n * 3);
  const rnd = mulberry(cfg.seed);
  for (let k = 0; k < n; k++) {
    // distribuzione con picco centrale e lacune di Kirkwood accennate
    let a;
    do { a = cfg.aMin + rnd() * (cfg.aMax - cfg.aMin); }
    while (cfg.gaps && cfg.gaps.some(g => Math.abs(a - g) < 0.022) && rnd() < 0.93);
    aA[k] = a;
    aPh[k] = rnd() * Math.PI * 2;
    aIn[k] = (rnd() + rnd() - 1) * cfg.inc * DEG;
    aNo[k] = rnd() * Math.PI * 2;
    aEc[k] = rnd() * cfg.ecc;
    aSz[k] = cfg.size * (0.4 + Math.pow(rnd(), 3) * 2.2);
    const g = 0.56 + rnd() * 0.44;
    col[k * 3] = g * cfg.tint[0]; col[k * 3 + 1] = g * cfg.tint[1]; col[k * 3 + 2] = g * cfg.tint[2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aA', new THREE.BufferAttribute(aA, 1));
  geo.setAttribute('aPh', new THREE.BufferAttribute(aPh, 1));
  geo.setAttribute('aIn', new THREE.BufferAttribute(aIn, 1));
  geo.setAttribute('aNo', new THREE.BufferAttribute(aNo, 1));
  geo.setAttribute('aEc', new THREE.BufferAttribute(aEc, 1));
  geo.setAttribute('aSz', new THREE.BufferAttribute(aSz, 1));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), cfg.aMax * AU * 1.1);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uT: { value: 0 }, uAU: { value: AU }, uDpr: { value: 1 }, uOp: { value: cfg.opacity } },
    vertexShader: `
      #include <common>
      #include <logdepthbuf_pars_vertex>
      attribute float aA; attribute float aPh; attribute float aIn; attribute float aNo;
      attribute float aEc; attribute float aSz; attribute vec3 aColor;
      uniform float uT; uniform float uAU; uniform float uDpr;
      varying vec3 vC;
      void main(){
        vC = aColor;
        float nrad = 6.2831853 / (pow(aA, 1.5) * 365.25);   // 3ª legge di Kepler
        float th = aPh + nrad * uT;
        float r = aA * (1.0 - aEc * cos(th));               // ellitticità approssimata
        vec3 p = vec3(cos(th)*r, 0.0, sin(th)*r);
        float ci=cos(aIn), si=sin(aIn);
        p = vec3(p.x, p.z*si, p.z*ci);
        float cn=cos(aNo), sn=sin(aNo);
        p = vec3(p.x*cn - p.z*sn, p.y, p.x*sn + p.z*cn);
        vec4 mv = modelViewMatrix * vec4(p*uAU, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = max(1.0, aSz*uDpr * (260.0/max(1.0,-mv.z)));
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      uniform float uOp; varying vec3 vC;
      void main(){
        #include <logdepthbuf_fragment>
        vec2 d=gl_PointCoord-0.5; float r=length(d)*2.0;
        float a=exp(-r*r*3.0)*uOp;
        if(a<0.004) discard;
        gl_FragColor=vec4(vC*a,a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  return pts;
}

function shellMaterial(color, intensity, power) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) },

    vertexShader: `
      #include <common>

    fragmentShader: `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      uniform vec3 uColor; uniform float uInt; uniform float uPow;
      varying vec3 vN; varying vec3 vW;
      void main(){
        #include <logdepthbuf_fragment>
        vec3 V = normalize(cameraPosition - vW);
        float rim = pow(1.0 - abs(dot(normalize(vN), V)), uPow);
        float a = rim * uInt;
        gl_FragColor = vec4(uColor * a, a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide
  });
}

// profilo di Shue: r(θ) = R0 · (2/(1+cos θ))^0.6
function magnetopauseGeometry(R0, scale) {
  const pts = [];
  for (let k = 0; k <= 44; k++) {
    const th = (k / 44) * 140 * DEG;
    const r = R0 * scale * Math.pow(2 / (1 + Math.cos(th)), 0.6);
    pts.push(new THREE.Vector2(Math.max(0.001, r * Math.sin(th)), r * Math.cos(th)));
  }
  return new THREE.LatheGeometry(pts, 56);
}

// linee di campo di un dipolo: r = L·cos²(latitudine magnetica)
function fieldLines(Ls, meridians, color) {
  const pos = [];
  for (const L of Ls) {
    const lmax = Math.acos(Math.sqrt(1 / L));
    for (let m = 0; m < meridians; m++) {
      const ph = (m / meridians) * Math.PI * 2;
      const cp = Math.cos(ph), sp = Math.sin(ph);
      let prev = null;
      for (let k = 0; k <= 48; k++) {
        const lam = -lmax + (2 * lmax) * (k / 48);
        const r = L * Math.cos(lam) * Math.cos(lam);
        const x = r * Math.cos(lam), y = r * Math.sin(lam);
        const v = new THREE.Vector3(x * cp, y, x * sp);
        if (prev) pos.push(prev.x, prev.y, prev.z, v.x, v.y, v.z);
        prev = v;
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.30, depthWrite: false, blending: THREE.AdditiveBlending
  }));
}

// Venere e Marte non hanno campo: il vento colpisce l'atmosfera e se la
// porta via. Qui si vede la scia di ioni strappati.
function buildIonTail(b, color) {
  const root = new THREE.Group(); b.pivot.add(root);
  const pts = [];
  for (let k = 0; k <= 24; k++) {
    const t = k / 24;
    const y = -t * 6;                                   // sottovento
    const r = 1.05 + t * 2.3 * (1 - t * 0.35);
    pts.push(new THREE.Vector2(r, y));
  }
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(pts, 40),
                              shellMaterial(color, 0.30, 2.2));
  root.add(mesh);
  return { root, dip: null, mp: mesh, bs: null, lines: null, belts: null,
           aurora: null, cfg: { nose: 1.2 }, induced: true };
}

function buildMagnetosphere(b) {
  const cfg = MAGNETO[b.id];
  if (!cfg) return null;
  const root = new THREE.Group();          // asse +Y verso il Sole
  b.pivot.add(root);
  const dip = new THREE.Group();           // asse del dipolo = asse di rotazione
  dip.rotation.z = b.tilt * DEG;
  b.pivot.add(dip);

  const mp = new THREE.Mesh(magnetopauseGeometry(cfg.nose, 1.0),
                            shellMaterial(cfg.tint, 0.38, 2.6));
  const bs = new THREE.Mesh(magnetopauseGeometry(cfg.nose, 1.28),
                            shellMaterial(0xffa868, 0.15, 3.2));
  root.add(mp, bs);

  const lines = fieldLines([1.6, 2.4, 3.6, 5.4], 6, cfg.tint);
  dip.add(lines);

  let belts = null;
  if (cfg.belts) {
    belts = new THREE.Group();
    for (const [R, t, op] of [[1.6, 0.42, 0.16], [4.2, 1.05, 0.11]]) {
      const m = new THREE.Mesh(new THREE.TorusGeometry(R, t, 12, 48),
        new THREE.MeshBasicMaterial({ color: 0x6fe0b0, transparent: true, opacity: op,
                                      blending: THREE.AdditiveBlending, depthWrite: false }));
      m.rotation.x = Math.PI / 2;
      belts.add(m);
    }
    dip.add(belts);
  }

  let aurora = null;
  if (cfg.aurora) {
    aurora = new THREE.Group();
    for (const sgn of [1, -1]) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.40, 0.055, 10, 64),
        new THREE.MeshBasicMaterial({ color: cfg.aurora, transparent: true, opacity: 0.85,
                                      blending: THREE.AdditiveBlending, depthWrite: false }));
      ring.rotation.x = Math.PI / 2;
      ring.position.y = sgn * 0.93;
      aurora.add(ring);
    }
    dip.add(aurora);
  }

  return { root, dip, mp, bs, lines, belts, aurora, cfg };
}

/* ── vento solare: particelle che escono dal Sole in linea retta ───── */
let wind = null, windT = 0;
function makeWind(count) {
  const pos = new Float32Array(count * 3);
  const dir = new Float32Array(count * 3);
  const ph  = new Float32Array(count);
  const sp  = new Float32Array(count);
  const rnd = mulberry(5150);
  for (let k = 0; k < count; k++) {
    const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, c = Math.sqrt(1 - u * u);
    dir[k * 3] = c * Math.cos(a); dir[k * 3 + 1] = u; dir[k * 3 + 2] = c * Math.sin(a);
    ph[k] = rnd();
    sp[k] = 0.8 + rnd() * 0.5;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aDir', new THREE.BufferAttribute(dir, 3));
  g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aSp', new THREE.BufferAttribute(sp, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uT: { value: 0 }, uDpr: { value: 1 }, uSpan: { value: 7.0 * AU },
      uDefC: { value: new THREE.Vector3() },   // centro del pianeta che devia
      uDefA: { value: new THREE.Vector3(1, 0, 0) },
      uDefR: { value: 0 }
    },
    vertexShader: `
      #include <common>
      #include <logdepthbuf_pars_vertex>
      attribute vec3 aDir; attribute float aPh; attribute float aSp;
      uniform float uT; uniform float uDpr; uniform float uSpan;
      uniform vec3 uDefC; uniform vec3 uDefA; uniform float uDefR;
      varying float vF;
      void main(){
        float d = mod(aPh + uT*aSp, 1.0);
        vec3 pos = aDir * (0.03*uSpan + d*uSpan);
        if (uDefR > 0.0) {
          // la magnetopausa scansa il flusso: davanti è una cupola,
          // dietro si allunga in una coda
          vec3 rel = pos - uDefC;
          float along = dot(rel, uDefA);
          vec3 perp = rel - uDefA*along;
          float pd = length(perp);
          float shell = uDefR * (along < 0.0 ? 1.0
                       : mix(1.0, 1.7, clamp(along/(uDefR*5.0), 0.0, 1.0)));
          if (pd < shell && pd > 1e-5) {
            pos = uDefC + uDefA*along + perp*(shell/pd);
          }
        }
        vF = 1.0 - d;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = max(1.0, 3.2*uDpr*(220.0/max(1.0,-mv.z)));
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      varying float vF;
      void main(){
        #include <logdepthbuf_fragment>
        vec2 q = gl_PointCoord - 0.5;
        float r = length(q)*2.0;
        float a = exp(-r*r*3.0) * pow(vF, 1.4) * 1.05;
        if (a < 0.004) discard;
        gl_FragColor = vec4(vec3(1.0, 0.72, 0.42)*a, a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  return pts;
}

/* ════════════════════════════════════════════════════════════════════
   8. COSTRUZIONE DEI CORPI
