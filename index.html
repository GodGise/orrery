const SPHERE_HI = new THREE.SphereGeometry(1, 72, 40);
const SPHERE_MD = new THREE.SphereGeometry(1, 40, 24);
const SPHERE_LO = new THREE.SphereGeometry(1, 22, 14);

const bodies = [];        // tutti i corpi selezionabili
const byId = {};
let sunBody = null;

function addSun() {
  const pivot = new THREE.Group(); scene.add(pivot);
  const mesh = new THREE.Mesh(SPHERE_HI, sunMat);
  const tilt = new THREE.Group(); tilt.rotation.z = SUN.tilt * DEG;
  tilt.add(mesh); pivot.add(tilt);

  const corona = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), coronaMat);
  pivot.add(corona);

  const b = { ...SUN, pivot, mesh, tilt, corona, isSun: true, moons: [] };
  b.setScale = () => {
    const r = radiusOf(SUN.radius, true);
    mesh.scale.setScalar(r);
    corona.scale.setScalar(r * 5.2);
    coronaMat.uniforms.uLimb.value = 2 / 5.2;   // dov'è il bordo del disco
    b.r = r;
  };
  bodies.push(b); byId[b.id] = b; sunBody = b;
  return b;
}

function surfaceOpts(spec, res) {
  const seed = (spec.id || spec.name).split('').reduce((a, c) => a + c.charCodeAt(0) * 31, 7);
  const t = spec.tex;
  if (t === 'earth')  return ({ w: res, type: 'earth', pal: 'earth', seed, roughMap: true, nightMap: true });
  if (t === 'venus')  return ({ w: res, type: 'bands', pal: 'venus', seed, freq: 2.0, stretch: 4.0, latFreq: 3.2, bandFreq: 5, bandAmp: 0.1, turbAmp: 0.95, oct: 6 });
  if (t === 'mars')   return ({ w: res, type: 'rock', pal: 'mars', seed, freq: 2.6, oct: 6, craters: 26 });
  if (t === 'jupiter')return ({ w: res, type: 'bands', pal: 'jupiter', seed, freq: 2.2, stretch: 7.0, latFreq: 9, bandFreq: 17, bandAmp: 0.3, turbAmp: 0.52, oct: 6,
                        spot: { lat: -22, lonFrac: 0.33, rw: 0.085, rh: 0.055, color: ['rgba(190,86,48,.85)', 'rgba(206,128,86,.45)'] } });
  if (t === 'saturn') return ({ w: res, type: 'bands', pal: 'saturn', seed, freq: 2.0, stretch: 8.0, latFreq: 8, bandFreq: 13, bandAmp: 0.24, turbAmp: 0.38, oct: 5 });
  if (t === 'uranus') return ({ w: res, type: 'bands', pal: 'uranus', seed, freq: 1.7, stretch: 9.0, latFreq: 6, bandFreq: 7, bandAmp: 0.12, turbAmp: 0.22, oct: 4 });
  if (t === 'neptune')return ({ w: res, type: 'bands', pal: 'neptune', seed, freq: 1.9, stretch: 8.0, latFreq: 7, bandFreq: 9, bandAmp: 0.2, turbAmp: 0.34, oct: 5,
                        spot: { lat: -28, lonFrac: 0.6, rw: 0.06, rh: 0.04, color: ['rgba(10,24,64,.8)', 'rgba(20,44,104,.4)'] } });
  if (t === 'pluto')  return ({ w: res, type: 'rock', pal: 'pluto', seed, freq: 2.2, oct: 5, craters: 14 });
  if (t === 'cracked')return ({ w: res, type: 'smooth', pal: spec.pal, seed, cracks: spec.pal === 'europa' ? 90 : 46,
                        crackColor: spec.pal === 'europa' ? 'rgba(138,86,58,.42)' : 'rgba(96,120,150,.35)' });
  if (t === 'grooved')return ({ w: res, type: 'rock', pal: spec.pal, seed, freq: 2.8, oct: 5, grooves: 70, craters: 16 });
  if (t === 'blotch') return ({ w: res, type: 'blotch', pal: spec.pal, seed });
  if (t === 'smooth') return ({ w: res, type: 'smooth', pal: spec.pal, seed });
  return ({ w: res, type: 'rock', pal: spec.pal, seed, freq: 2.5, oct: 5, craters: spec.radius > 1000 ? 90 : 45 });
}

const surfaceFor      = (spec, res) => makeSurface(surfaceOpts(spec, res));
const surfaceForAsync = (spec, res) => makeSurfaceAsync(surfaceOpts(spec, res));

/* ── ombre analitiche e luci notturne ──────────────────────────────────
   MeshStandardMaterial non sa nulla di anelli né di eclissi, quindi inietto
   il calcolo nel suo shader: per ogni frammento tiro un raggio verso il Sole
   e guardo se incontra il piano degli anelli o una luna.                  */

const RING_DENSITY_GLSL = `
float ringDens(float t){
  if(t < 0.0 || t > 1.0) return 0.0;
  float f1 = fbm3(vec3(t*24.0, 1.7, 4.3), 5);
  float f2 = fbm3(vec3(t*88.0, 8.1, 2.2), 3);
  float band = clamp(0.14 + 1.35*f1*f1 + 0.28*f2 - 0.16*sin(t*205.0), 0.0, 1.25);
  float cassini   = smoothstep(0.012, 0.055, abs(t-0.605));
  float encke     = smoothstep(0.004, 0.016, abs(t-0.905));
  float innerFade = smoothstep(0.0, 0.10, t);
  float outerFade = 1.0 - smoothstep(0.90, 1.0, t);
  return clamp(band*cassini*encke*innerFade*outerFade, 0.0, 1.0);
}
`;

const OCC_GLSL = `
float occShadow(vec3 fragV, vec3 Ldir, float Ldist, vec4 o){
  if(o.w <= 0.0) return 1.0;
  vec3 oc = o.xyz - fragV;
  float tc = dot(oc, Ldir);
  if(tc <= 0.0 || tc >= Ldist) return 1.0;
  float d = length(oc - Ldir*tc);
  return smoothstep(o.w*0.78, o.w*1.35, d);
}
`;

function patchPlanetMaterial(mat, cfg) {
  const u = {
    uSunView: { value: new THREE.Vector3() },
    uOcc:     { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
    uRingC:   { value: new THREE.Vector3() },
    uRingN:   { value: new THREE.Vector3(0, 1, 0) },
    uRingIn:  { value: 0 }, uRingOut: { value: 0 }, uRingOn: { value: 0 }
  };
  if (cfg.night) { u.uNight = { value: cfg.night }; u.uNightInt = { value: 1.7 }; }
  mat.userData.u = u;

  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, u);

    sh.vertexShader = 'varying vec2 vUvN;\n' + sh.vertexShader
      .replace('#include <begin_vertex>', 'vUvN = uv;\n#include <begin_vertex>');

    let head = 'varying vec2 vUvN;\nuniform vec3 uSunView;\nuniform vec4 uOcc[4];\n'
      + 'uniform vec3 uRingC;\nuniform vec3 uRingN;\n'
      + 'uniform float uRingIn;\nuniform float uRingOut;\nuniform float uRingOn;\n'
      + OCC_GLSL;
    if (cfg.rings) head += GLSL_NOISE + RING_DENSITY_GLSL;
    if (cfg.night) head += 'uniform sampler2D uNight;\nuniform float uNightInt;\n';
    sh.fragmentShader = head + '\n' + sh.fragmentShader;

    let body = `
      vec3 orFragV = -vViewPosition;
      vec3 orLv = uSunView - orFragV;
      float orLd = length(orLv);
      vec3 orLdir = orLv / max(orLd, 1e-6);
      float orShadow = 1.0;
      orShadow *= occShadow(orFragV, orLdir, orLd, uOcc[0]);
      orShadow *= occShadow(orFragV, orLdir, orLd, uOcc[1]);
      orShadow *= occShadow(orFragV, orLdir, orLd, uOcc[2]);
      orShadow *= occShadow(orFragV, orLdir, orLd, uOcc[3]);`;
    if (cfg.rings) body += `
      if (uRingOn > 0.5) {
        float den = dot(orLdir, uRingN);
        if (abs(den) > 1e-4) {
          float tt = dot(uRingC - orFragV, uRingN) / den;
          if (tt > 0.0) {
            float rr = length(orFragV + orLdir*tt - uRingC);
            orShadow *= 1.0 - 0.80*ringDens((rr - uRingIn)/(uRingOut - uRingIn));
          }
        }
      }`;
    if (cfg.night) body += `
      float orNight = smoothstep(0.10, -0.20, dot(normalize(normal), orLdir));
      totalEmissiveRadiance += texture2D(uNight, vUvN).rgb * uNightInt * orNight;`;

    sh.fragmentShader = sh.fragmentShader
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>' + body)
      .replace('#include <aomap_fragment>',
               '#include <aomap_fragment>\n reflectedLight.directDiffuse *= orShadow;'
               + '\n reflectedLight.directSpecular = min(reflectedLight.directSpecular, vec3(0.42))'
               + ' * orShadow;');
  };
  return mat;
}

function addPlanet(spec, res) {
  const pivot = new THREE.Group(); scene.add(pivot);
  const tilt = new THREE.Group(); pivot.add(tilt);
  tilt.rotation.z = spec.tilt * DEG;
  // piano equatoriale (non ruota): è lì che orbitano i satelliti regolari
  const equator = new THREE.Group(); pivot.add(equator);
  equator.rotation.z = spec.tilt * DEG;

  const s = surfaceFor(spec, res);
  const mat = new THREE.MeshStandardMaterial({
    map: s.map, bumpMap: s.bump, bumpScale: spec.big ? 0.04 : 0.9,
    roughness: 0.85, metalness: 0.0
  });
  if (s.rough) { mat.roughnessMap = s.rough; mat.roughness = 1.0; }
  const geo = spec.big || spec.radius > 3000 ? SPHERE_HI : SPHERE_MD;
  const mesh = new THREE.Mesh(geo, mat);
  tilt.add(mesh);

  let clouds = null;
  if (spec.clouds) {
    clouds = new THREE.Mesh(SPHERE_HI, new THREE.MeshStandardMaterial({
      map: makeClouds(res), transparent: true, opacity: 0.88, roughness: 1, metalness: 0,
      depthWrite: false
    }));
    tilt.add(clouds);
  }

  let atmo = null;
  if (spec.atmo) {
    atmo = new THREE.Mesh(SPHERE_MD, atmoMaterial(
      spec.atmo, spec.big ? 2.8 : 3.4,
      spec.id === 'terra' ? 1.05 : spec.big ? 0.8 : 0.95,
      spec.id === 'terra' ? 1.0 : spec.id === 'marte' ? 0.5 : 0.0));
    tilt.add(atmo);
  }

  let rings = null, ringIn = 0, ringOut = 0;
  if (spec.rings) {
    const inner = spec.rings === 'faint' ? 1.6 : 1.24, outer = spec.rings === 'faint' ? 2.1 : 2.32;
    ringIn = inner; ringOut = outer;
    const rg = new THREE.RingGeometry(inner, outer, 256, 1);
    rings = new THREE.Mesh(rg, ringMaterial(inner, outer, spec.rings));
    rings.rotation.x = Math.PI / 2;
    equator.add(rings);   // gli anelli non ruotano col pianeta
  }

  const orbitLine = makeOrbitLine(spec);
  scene.add(orbitLine);

  patchPlanetMaterial(mat, { night: s.night || null, rings: !!spec.rings });

  const b = {
    ...spec, pivot, tilt, equator, mesh, clouds, atmo, rings, orbitLine, moons: [],
    texRes: res, ringInK: ringIn, ringOutK: ringOut,
    rotPhase: (spec.id.charCodeAt(0) % 10) * 0.6
  };
  b.setScale = () => {
    const r = radiusOf(spec.radius);
    mesh.scale.setScalar(r);
    if (clouds) clouds.scale.setScalar(r * 1.012);
    if (atmo)   atmo.scale.setScalar(r * (spec.big ? 1.035 : 1.055));
    if (rings)  rings.scale.setScalar(r);
    b.ringInW = ringIn * r; b.ringOutW = ringOut * r;
    b.r = r;
  };
  bodies.push(b); byId[b.id] = b;
  return b;
}

function addMoon(spec, res) {
  const parent = byId[spec.parent];
  // i satelliti regolari orbitano nel piano equatoriale del pianeta;
  // la Luna è un'eccezione e segue quasi l'eclittica
  const host = spec.ecliptic ? parent.pivot : (parent.equator || parent.pivot);
  const orbit = new THREE.Group();
  host.add(orbit);
  const holder = new THREE.Group();
  orbit.add(holder);
  const s = surfaceFor(spec, res);
  const mesh = new THREE.Mesh(spec.radius > 1200 ? SPHERE_MD : SPHERE_LO,
    new THREE.MeshStandardMaterial({ map: s.map, bumpMap: s.bump, bumpScale: 0.6, roughness: 0.92 }));
  holder.add(mesh);

  const ring = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(
      Array.from({ length: 129 }, (_, k) => {
        const a = (k / 128) * Math.PI * 2;
        return new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
      })),
    new THREE.LineBasicMaterial({ color: 0x5b7aa0, transparent: true, opacity: 0.22 })
  );
  host.add(ring);

  const b = { ...spec, kind: 'Satellite naturale di ' + parent.name, isMoon: true,
    pivot: holder, mesh, orbit, ring, parentBody: parent, moons: [],
    swatch: `radial-gradient(circle at 34% 30%,${rgbCss(rampColor(spec.pal, .85))},${rgbCss(rampColor(spec.pal, .5))} 55%,${rgbCss(rampColor(spec.pal, .12))} 100%)`,
    stats: [['Raggio', fmtKm(spec.radius), ''], ['Distanza', fmtKm(spec.a), 'da ' + parent.name],
      ['Periodo orbitale', dec(Math.abs(spec.P), 2) + ' giorni', spec.P < 0 ? 'retrogrado' : ''],
      ['Rotazione', 'sincrona', 'stessa faccia']] };
  b.setScale = () => {
    const r = radiusOf(spec.radius);
    mesh.scale.setScalar(r);
    const d = moonDist(spec, parent);
    holder.position.x = d;
    ring.scale.setScalar(d);
    b.orbitR = d;
    b.r = r;
  };
  bodies.push(b); byId[b.id] = b;
  parent.moons.push(b);
  return b;
}

function moonDist(spec, parent) {
  if (realScale) return (spec.a / AU_KM) * AU;
  // modalità visuale: spaziatura proporzionale al raggio del pianeta
  const sib = MOONS.filter(m => m.parent === spec.parent);
  const amax = Math.max(...sib.map(m => m.a));
  const f = Math.pow(spec.a / amax, 0.72);
  return radiusOf(parent.radius) * (2.2 + f * 4.2);
}

function makeOrbitLine(spec) {
  const N = 640, pts = [];
  const tmp = new THREE.Vector3();
  for (let k = 0; k <= N; k++) {
    orbitalPos({ ...spec, M0: (k / N) * 360 }, 0, tmp);
    pts.push(tmp.clone());
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const dwarf = spec.dwarf;
  const mat = new THREE.LineBasicMaterial({
    color: dwarf ? 0x6a7a92 : 0x7f9fc4,
    transparent: true, opacity: dwarf ? 0.16 : 0.3
  });
  const l = new THREE.Line(geo, mat);
  l.userData.baseOpacity = mat.opacity;
  return l;
}

const rgbCss = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const grp = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const dec = (n, d) => n.toFixed(d).replace('.', ',');
function fmtKm(v) {
  if (v >= 1e6) return dec(v / 1e6, 2) + ' milioni di km';
  return grp(v) + ' km';
}

/* ── sonde spaziali ───────────────────────────────────────────────── */

const probeList = [];
let probeField = null, probeTrails = null;
const tmpP = new THREE.Vector3();

let realClock = 0;                   // secondi reali, per le orbite velocissime

function probePos(p, days, out) {
  if (p.dir) {                       // interstellari: distanza reale + direzione
    const d = p.d0 + p.rate * (days - p.epoch) / 365.25;
    const lam = p.dir[0] * DEG, bet = p.dir[1] * DEG, cb = Math.cos(bet);
    return out.set(d * cb * Math.cos(lam) * AU, d * Math.sin(bet) * AU,
                  -d * cb * Math.sin(lam) * AU);
  }
  const host = byId[p.near];
  host.pivot.getWorldPosition(out);
  const k = Math.max(host.r, 0.4);

  if (p.surface) {                   // rover: ruota col pianeta
    const la = p.surface.lat * DEG;
    const lo = p.surface.lon * DEG + (host.tilt ? host.tilt.rotation.y : 0);
    const cl = Math.cos(la) * k * 1.02;
    out.x += cl * Math.cos(lo); out.y += Math.sin(la) * k * 1.02; out.z += cl * Math.sin(lo);
    return out;
  }

  if (p.orb) {
    const o = p.orb;
    // sotto il giorno il moto sarebbe una sfocatura: lo si guarda a tempo reale
    const fast = o.P < 0.4;
    const M = fast ? realClock * 0.9 + (p.phase0 || 0)
                   : (days / o.P) * Math.PI * 2 + (p.phase0 || 0);
    let E = M;
    for (let i = 0; i < 5; i++) E -= (E - o.e * Math.sin(E) - M) / (1 - o.e * Math.cos(E));
    const a = o.a * k;
    let x = a * (Math.cos(E) - o.e), z = a * Math.sqrt(1 - o.e * o.e) * Math.sin(E), y = 0;
    const ci = Math.cos(o.inc * DEG), si = Math.sin(o.inc * DEG);
    [y, z] = [z * si, z * ci];
    const cn = Math.cos(o.node * DEG), sn = Math.sin(o.node * DEG);
    [x, z] = [x * cn - z * sn, x * sn + z * cn];
    if (p.l2) {                      // Webb: attorno a L2, sulla verticale opposta al Sole
      tmpL2.copy(out).normalize().multiplyScalar(k * 3.2);
      out.add(tmpL2);
    }
    out.x += x; out.y += y; out.z += z;
    return out;
  }

  if (p.off) { out.x += p.off[0] * k; out.y += p.off[1] * k; out.z += p.off[2] * k; }
  return out;
}
const tmpL2 = new THREE.Vector3();

const PROBE_TINT = { attiva: [0.52, 0.86, 1.0], conclusa: [0.92, 0.74, 0.52], silenziosa: [0.62, 0.66, 0.76] };

function addProbes() {
  const placed = PROBES.filter(p => !p.listOnly);
  const n = placed.length;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  placed.forEach((p, k) => {
    const c = PROBE_TINT[p.state] || PROBE_TINT.attiva;
    col[k * 3] = c[0]; col[k * 3 + 1] = c[1]; col[k * 3 + 2] = c[2];
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e7);
  probeField = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uDpr: { value: 1 } },
    vertexShader: `
      #include <common>
      #include <logdepthbuf_pars_vertex>
      attribute vec3 aColor; uniform float uDpr; varying vec3 vC;
      void main(){ vC = aColor;
        gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);
        gl_PointSize = 11.0*uDpr;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      varying vec3 vC;
      void main(){
        #include <logdepthbuf_fragment>
        // rombo cavo: si distingue da una stella anche a pochi pixel
        vec2 d = abs(gl_PointCoord - 0.5) * 2.0;
        float m = d.x + d.y;
        float edge = smoothstep(1.02, 0.86, m) - smoothstep(0.58, 0.40, m);
        float core = smoothstep(0.30, 0.0, m) * 0.9;
        float a = clamp(edge + core, 0.0, 1.0);
        if (a < 0.02) discard;
        gl_FragColor = vec4(vC*a, a);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
  }));
  probeField.frustumCulled = false; probeField.renderOrder = 4;
  scene.add(probeField);

  // scie delle interstellari: una retta dal Sole alla sonda
  const far = placed.filter(p => p.dir);
  const tp = new Float32Array(far.length * 6);
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.BufferAttribute(tp, 3));
  tg.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e7);
  probeTrails = new THREE.LineSegments(tg, new THREE.LineBasicMaterial({
    color: 0x5f9fd0, transparent: true, opacity: 0.2, depthWrite: false
  }));
  probeTrails.frustumCulled = false;
  scene.add(probeTrails);

  placed.forEach((p, k) => {
    p.phase0 = k * 1.7;
    const pivot = new THREE.Object3D(); scene.add(pivot);
    const b = Object.assign({}, p, {
      pivot, isProbe: true, moons: [], r: 0.5,
      swatch: p.state === 'attiva'   ? 'linear-gradient(140deg,#9fe0ff,#2f7fb8)'
            : p.state === 'conclusa' ? 'linear-gradient(140deg,#f0cfa0,#8a6336)'
            :                          'linear-gradient(140deg,#c2c8d4,#5b6472)',
      setScale: () => {}
    });
    probeList.push(b); bodies.push(b); byId[b.id] = b;
  });
}

function updateProbes(dt) {
  if (!probeField) return;
  realClock += dt || 0;
  const arr = probeField.geometry.attributes.position.array;
  const tarr = probeTrails.geometry.attributes.position.array;
  let t = 0;
  probeList.forEach((p, k) => {
    probePos(p, S.days, tmpP);
    p.pivot.position.copy(tmpP);
    arr[k * 3] = tmpP.x; arr[k * 3 + 1] = tmpP.y; arr[k * 3 + 2] = tmpP.z;
    if (p.dir) {
      tarr[t] = 0; tarr[t + 1] = 0; tarr[t + 2] = 0;
      tarr[t + 3] = tmpP.x; tarr[t + 4] = tmpP.y; tarr[t + 5] = tmpP.z;
      t += 6;
    }
  });
  probeField.geometry.attributes.position.needsUpdate = true;
  probeTrails.geometry.attributes.position.needsUpdate = true;
}

const labelsEl = document.getElementById('labels');
function buildLabels() {
  for (const b of bodies) {
    const el = document.createElement('div');
    el.className = 'lab' + (b.isMoon ? ' moon' : '')
      + (b.isProbe ? ' probe' + (b.state === 'attiva' ? '' : ' dim') : '');
    el.innerHTML = `<span class="dot"></span>${b.name}`;
    el.addEventListener('click', ev => { ev.stopPropagation(); select(b, true); });
    labelsEl.appendChild(el);
    b.label = el;
  }
  // priorità: Sole, pianeti dal più grande, pianeti nani, lune
  const prio = b => b.isSun ? 0 : b.isMoon ? 3 : b.dwarf ? 2
    : 1 + (1 - Math.min(b.radius, 70000) / 70000) * 0.9;
  labelOrder = bodies.slice().sort((a, b) => prio(a) - prio(b));
  labelDraw = labelOrder;
}
let labelOrder = [], labelDraw = [];

  labelDraw = S.focus ? [S.focus, ...labelOrder.filter(b => b !== S.focus)] : labelOrder;
}

let composer, bloom, renderPass, outputPass;
function buildComposer() {
  if (composer) composer.dispose();
  composer = new EffectComposer(renderer);
  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  const str = S.quality === 'low' ? 0.42 : S.quality === 'med' ? 0.62 : 0.8;
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), str, 0.62, 0.72);
  composer.addPass(bloom);
  outputPass = new OutputPass();
  composer.addPass(outputPass);
  resize();
}

// Su schermi stretti il pannello copre metà schermo: sposto il centro di
// proiezione verso l'alto così il corpo selezionato resta nella parte libera.
function applyViewOffset() {
  const narrow = innerWidth <= 820;
  if (narrow && infoEl && infoEl.classList.contains('show')) {
    const top = infoEl.getBoundingClientRect().top;
    const frac = Math.max(0, (innerHeight - top) / 2) / innerHeight;
    camera.setViewOffset(1, 1, 0, frac, 1, 1);
  } else if (camera.view && camera.view.enabled) {
    camera.clearViewOffset();
  }
}

function resize() {
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, S.quality === 'low' ? 1 : S.quality === 'med' ? 1.5 : 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  applyViewOffset();
  if (stars) stars.material.uniforms.uDpr.value = dpr;
  if (belt) belt.material.uniforms.uDpr.value = dpr;
  if (probeField) probeField.material.uniforms.uDpr.value = dpr;
  if (wind) wind.material.uniforms.uDpr.value = dpr;
  if (kuiper) kuiper.material.uniforms.uDpr.value = dpr;
}
addEventListener('resize', resize);

let tween = null;
const prevTarget = new THREE.Vector3();
const wp = new THREE.Vector3();

function select(b, fly = true) {
  S.focus = b;
  for (const o of bodies) o.label.classList.toggle('sel', o === b);
  syncNav(b);
  reorderLabels();
  if (!b) { infoEl.classList.remove('show'); applyViewOffset(); return; }

  iName.textContent = b.name;
  iKind.textContent = b.kind;
  iSwatch.style.background = b.swatch;
  iStats.innerHTML = (b.stats || []).map(([k, v, s]) =>
    `<div class="stat"><dt>${k}</dt><dd>${v}${s ? ` <small>${s}</small>` : ''}</dd></div>`).join('');
  if (b.cmp) { iCmp.textContent = b.cmp; iCmp.hidden = false; } else iCmp.hidden = true;
  iNote.innerHTML = b.note || '';
  iProbeList.hidden = true;
  if (MAG_INFO[b.id]) { iMagTxt.textContent = MAG_INFO[b.id]; iMag.hidden = false; }
  else iMag.hidden = true;
  if (b.link) { iLink.href = b.link; iLink.hidden = false; } else iLink.hidden = true;
  if (b.isProbe && b.dir) {
    // per le interstellari la distanza è calcolata alla data mostrata
    const d = b.d0 + b.rate * (S.days - b.epoch) / 365.25;
    const e1 = document.createElement('div'); e1.className = 'stat';
    e1.innerHTML = '<dt>Distanza dal Sole</dt><dd>' + dec(d, 1) +
      ' UA <small>' + grp(d * AU_KM / 1e6) + ' milioni di km</small></dd>';
    iStats.appendChild(e1);
    const e2 = document.createElement('div'); e2.className = 'stat';
    e2.innerHTML = '<dt>Il segnale impiega</dt><dd>' +
      dec(d * AU_KM / 299792.458 / 3600, 1) + ' ore <small>solo andata</small></dd>';
    iStats.appendChild(e2);
  }
  if (b.moons.length) {
    iMoons.hidden = false;
    iMchips.innerHTML = '';
    for (const m of b.moons) {
      const c = document.createElement('button');
      c.className = 'mchip'; c.textContent = m.name;
      c.onclick = () => select(m, true);
      iMchips.appendChild(c);
    }
  } else iMoons.hidden = true;
  infoEl.classList.add('show');
  infoEl.scrollTop = 0;
  applyViewOffset();
  upgradeTextures(b);

  if (fly) {
    b.pivot.getWorldPosition(wp);
    // inquadra il pianeta, allargando quanto basta a far entrare la luna più interna
    let dist = b.r * (b.isSun ? 6.5 : b.rings ? 7.2 : 4.4);
    if (b.isProbe) {
      // una sonda è un punto: va inquadrata col suo contesto, non da sola
      dist = b.dir ? b.pivot.position.length() * 1.25
                   : Math.max((byId[b.near] || { r: 1 }).r * 5.5, 2.5);
    }
    if (b.moons.length) {
      const inner = Math.min(...b.moons.map(m => m.orbitR));
      dist = Math.max(dist, Math.min(inner * 1.9, b.r * 11));
    }
    // col vento solare acceso serve spazio per vedere tutta la magnetosfera
    if (S.showWind && b.magViz) dist = Math.max(dist, b.r * b.magViz.cfg.nose * (b.magViz.induced ? 9 : 11));
    dist = Math.max(dist, 0.05);
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-8) dir.set(0.5, 0.35, 1);
    dir.normalize();
    // leggera inclinazione per non guardare mai esattamente di taglio
    dir.y = Math.max(dir.y, 0.16); dir.normalize();
    tween = { t: 0, dur: 1.15, fromPos: camera.position.clone(), fromTgt: controls.target.clone(), dist, dir, body: b };
  }
}

/* Le texture nascono a risoluzione media perché il caricamento resti breve.
   Quando un corpo viene inquadrato da vicino la sua texture viene rigenerata
   al doppio, a fasce, senza interrompere l'animazione.                     */
const HI_MAX = 2048;
let upgrading = false;
async function upgradeTextures(b) {
  if (upgrading || !b || b.isSun || b.hiRes || S.quality !== 'high') return;
  const res = Math.min((b.texRes || 512) * 2, HI_MAX);
  if (res <= (b.texRes || 512)) { b.hiRes = true; return; }
  upgrading = true;
  try {
    const s = await makeSurfaceAsync(surfaceOpts(b, res));
    const mat = b.mesh.material;
    for (const k of ['map', 'bumpMap', 'roughnessMap']) if (mat[k]) mat[k].dispose();
    mat.map = s.map; mat.bumpMap = s.bump;
    if (s.rough) mat.roughnessMap = s.rough;
    const u = mat.userData.u;
    if (s.night && u && u.uNight) { u.uNight.value.dispose(); u.uNight.value = s.night; }
    if (b.clouds) {
      const c = await makeCloudsAsync(res);
      b.clouds.material.map.dispose();
      b.clouds.material.map = c;
      b.clouds.material.needsUpdate = true;
    }
    b.texRes = res; b.hiRes = true;
  } catch (e) {
    console.warn('rigenerazione texture non riuscita', e);
  } finally { upgrading = false; }
}

document.getElementById('iclose').onclick = () => select(null, false);

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downPos = null;
canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6) return;
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const meshes = bodies.filter(b => b.mesh).map(b => b.mesh);
  const hits = ray.intersectObjects(meshes, false);
  if (hits.length) {
    const b = bodies.find(x => x.mesh === hits[0].object);
    if (b) { select(b, true); return; }
  }
  select(null, false);
});

/* ── elenco laterale: un clic porta al corpo ───────────────────────── */
function buildNav() {
  const host = document.getElementById('nav-body');
  const section = (title, items, probe) => {
    const h = document.createElement('div');
    h.className = 'eyebrow'; h.textContent = title; host.appendChild(h);
    for (const it of items) {
      const btn = document.createElement('button');
      btn.className = 'navb' + (probe ? ' pr' : '') + (probe && it.state !== 'attiva' ? ' dimdot' : '');
      const dot = document.createElement('i');
      if (!probe) dot.style.background = it.swatch;
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(it.name));
      btn.onclick = () => {
        const b = byId[it.id];
        if (b) select(b, true); else showProbeCard(it);
      };
      it.navBtn = btn;
      host.appendChild(btn);
    }
  };
  section('Sole e pianeti', bodies.filter(b => b.isSun || (!b.isMoon && !b.isProbe)), false);
  section('Lune', bodies.filter(b => b.isMoon), false);
  section('Sonde e satelliti', PROBES.map(pr => byId[pr.id] || pr), true);
}

function syncNav(sel) {
  for (const b of bodies) if (b.navBtn) b.navBtn.classList.toggle('sel', b === sel);
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); bPlay.onclick(); }
  else if (e.key === 'ArrowRight') { slider.value = Math.min(100, +slider.value + 100 / (SPEEDS.length - 1)); applySlider(); }
  else if (e.key === 'ArrowLeft')  { slider.value = Math.max(0, +slider.value - 100 / (SPEEDS.length - 1)); applySlider(); }
  else if (e.key === 'o' || e.key === 'O') { document.getElementById('t-orbits').click(); }
  else if (e.key === 'l' || e.key === 'L') { document.getElementById('t-labels').click(); }
  else if (e.key === 'Escape') select(null, false);
});

const hintEl = document.getElementById('hint');
let hintTimer = setTimeout(() => hintEl.classList.add('gone'), 9000);
canvas.addEventListener('pointerdown', () => { clearTimeout(hintTimer); hintEl.classList.add('gone'); }, { once: true });

/* ── righello di scala ─────────────────────────────────────────────── */
const rulerT = document.getElementById('ruler-t');
function updateRuler() {
  const d = camera.position.distanceTo(controls.target);
  // quanti UA copre una barra di 120 px al centro dello schermo
  const worldPerPx = 2 * Math.tan(camera.fov * DEG / 2) * d / innerHeight;
  const span = (worldPerPx * 120) / AU;     // in UA
  let txt;
  if (span < 1e-4) txt = (span * AU_KM).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' km';
  else if (span < 0.02) txt = (span * AU_KM / 1000).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' mila km';
  else if (span < 1) txt = span.toFixed(3).replace('.', ',') + ' UA';
  else txt = span.toFixed(span < 10 ? 2 : 0).replace('.', ',') + ' UA';
  rulerT.textContent = txt;
}

/* ════════════════════════════════════════════════════════════════════
   14. LOOP
   ════════════════════════════════════════════════════════════════════ */

const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                'luglio','agosto','settembre','ottobre','novembre','dicembre'];
let lastDateStr = '', lastDay = NaN;
function updateDate() {
  const day = Math.floor(S.days);
  if (day === lastDay) return;
  lastDay = day;
  const d = new Date(J2000 + S.days * DAY_MS);
  const s = `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  if (s !== lastDateStr) {
    lastDateStr = s;
    tDate.textContent = s;
    const yrs = S.days / 365.25;
    tRel.textContent = Math.abs(yrs) < 1
      ? (yrs >= 0 ? '+' : '−') + Math.abs(S.days).toFixed(0) + ' g da J2000'
      : (yrs >= 0 ? '+' : '−') + Math.abs(yrs).toFixed(1).replace('.', ',') + ' anni da J2000';
  }
}

const sunWorld = new THREE.Vector3();
const sunView = new THREE.Vector3();
// sottoinsiemi fissi: scorrere tutti i corpi a ogni frame è spreco
let shadowBodies = [], magBodies = [], orbitBodies = [];
const tmpV = new THREE.Vector3();
const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (S.playing) S.days += S.speed * S.dir * dt;

  // ── posizioni orbitali ──
  for (const b of bodies) {
    if (b.isSun || b.isMoon || b.isProbe) continue;
    orbitalPos(b, S.days, tmpV);
    b.pivot.position.copy(tmpV);
    // rotazione propria
    const rotDays = b.rot / 24;
    b.tilt.rotation.y = (S.days / rotDays) * Math.PI * 2 + b.rotPhase;
    if (b.clouds) b.clouds.rotation.y = (S.days / (rotDays * 16)) * Math.PI * 2;
  }
  for (const m of bodies) {
    if (!m.isMoon) continue;
    const ang = (S.days / m.P) * Math.PI * 2;
    m.orbit.rotation.y = -ang;
    m.pivot.rotation.y = ang;        // rotazione sincrona
  }

  sunBody.tilt.rotation.y = (S.days / 25.4) * Math.PI * 2;
  sunMat.uniforms.uTime.value = S.days;
  coronaMat.uniforms.uTime.value = S.days;
  sunBody.corona.quaternion.copy(camera.quaternion);

  // ── shader che hanno bisogno della posizione del Sole ──
  sunBody.pivot.getWorldPosition(sunWorld);
  for (const b of bodies) {
    if (b.atmo) b.atmo.material.uniforms.uSun.value.copy(sunWorld);
    if (b.rings) {
      const u = b.rings.material.uniforms;
      u.uSun.value.copy(sunWorld);
      b.pivot.getWorldPosition(u.uCenter.value);
      u.uRadius.value = b.r;
    }
  }
  if (belt)   belt.material.uniforms.uT.value = S.days;
  if (kuiper) kuiper.material.uniforms.uT.value = S.days;
  updateProbes(dt);
  updateFields(dt);

  // ombre analitiche: Sole, lune e anelli espressi in spazio-vista
  sunView.copy(sunWorld).applyMatrix4(camera.matrixWorldInverse);
  for (const b of shadowBodies) {
    const u = b.mesh.material.userData.u;
    u.uSunView.value.copy(sunView);
    for (let k = 0; k < 4; k++) {
      const m = b.shadowers && b.shadowers[k];
      const o = u.uOcc.value[k];
      if (m) {
        m.pivot.getWorldPosition(tmpV).applyMatrix4(camera.matrixWorldInverse);
        o.set(tmpV.x, tmpV.y, tmpV.z, m.r);
      } else o.set(0, 0, 0, 0);
    }
    if (b.rings) {
      u.uRingOn.value = 1;
      b.pivot.getWorldPosition(tmpV).applyMatrix4(camera.matrixWorldInverse);
      u.uRingC.value.copy(tmpV);
      u.uRingN.value.set(0, 0, 1).transformDirection(b.rings.matrixWorld)
        .transformDirection(camera.matrixWorldInverse).normalize();
      u.uRingIn.value = b.ringInW; u.uRingOut.value = b.ringOutW;
    }
  }

  // ── camera ──
  if (tween) {
    tween.t += dt / tween.dur;
    const k = tween.t >= 1 ? 1 : 1 - Math.pow(1 - tween.t, 3);
    tween.body.pivot.getWorldPosition(wp);
    const toPos = wp.clone().addScaledVector(tween.dir, tween.dist);
    camera.position.lerpVectors(tween.fromPos, toPos, k);
    controls.target.lerpVectors(tween.fromTgt, wp, k);
    prevTarget.copy(controls.target);
    if (tween.t >= 1) tween = null;
  } else if (S.focus) {
    S.focus.pivot.getWorldPosition(wp);
    tmpV.subVectors(wp, prevTarget);
    controls.target.add(tmpV);
    camera.position.add(tmpV);
    prevTarget.copy(wp);
  }
  controls.minDistance = S.focus ? Math.max(S.focus.r * 1.18, 0.01) : 0.02;
  controls.update();

  // ── etichette: poste sopra il disco, con scarto di quelle sovrapposte ──
  const camDist = camera.position.distanceTo(controls.target);
  const pxPerRad = innerHeight / (2 * Math.tan(camera.fov * DEG / 2));
  boxes.length = 0;
  for (const b of labelDraw) {
    const el = b.label;
    if (!S.showLabels || (b.isProbe && !S.showProbes)) { el.classList.add('hidden'); continue; }
    b.pivot.getWorldPosition(tmpV);
    const dToCam = tmpV.distanceTo(camera.position);
    tmpV.project(camera);
    const rPx = (b.r / dToCam) * pxPerRad;
    let keep = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.18;
    // una luna appare solo quando il suo sistema è abbastanza grande sullo schermo
    if (keep && b.isMoon) keep = (b.orbitR / dToCam) * pxPerRad > 40;
    // e un corpo sparisce quando lo si ha addosso
    if (keep && !b.isSun && !b.isProbe) keep = rPx < innerHeight * 0.45;
    if (!keep) { el.classList.add('hidden'); continue; }

    const x = (tmpV.x * 0.5 + 0.5) * innerWidth;
    const y = (-tmpV.y * 0.5 + 0.5) * innerHeight;
    const w = el._w || (el._w = el.offsetWidth || 72);
    const box = { x: x - w / 2 - 4, y: y - 12, w: w + 8, h: 24 };
    let clash = false;
    if (b !== S.focus) {
      for (const p of boxes) {
        if (box.x < p.x + p.w && box.x + box.w > p.x && box.y < p.y + p.h && box.y + box.h > p.y) { clash = true; break; }
      }
    }
    if (clash) { el.classList.add('hidden'); continue; }
    boxes.push(box);
    el.classList.remove('hidden');
    el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px)`;
  }

  // orbite: più visibili quando sono inquadrate da lontano
  if (S.showOrbits) {
    const f = clamp01(camDist / (AU * 1.2));
    for (const b of orbitBodies) {
      b.orbitLine.material.opacity = b.orbitLine.userData.baseOpacity * (0.35 + 0.65 * f);
    }
  }

  updateDate();
  updateRuler();
  composer.render();
  requestAnimationFrame(tick);
}

const UP = new THREE.Vector3(0, 1, 0);
const toSunV = new THREE.Vector3();

function updateFields(dt) {
  if (!wind) return;
  if (S.showWind) {
    // il flusso scorre a velocità guardabile, non a quella della simulazione
    windT += dt * Math.min(Math.max(S.speed, 0.15), 4) * 0.09;
    wind.material.uniforms.uT.value = windT;
  }
  const defl = S.focus && S.focus.magViz && !S.focus.magViz.induced ? S.focus : null;
  const u = wind.material.uniforms;
  if (defl && S.showWind) {
    defl.pivot.getWorldPosition(tmpV);
    u.uDefC.value.copy(tmpV);
    u.uDefA.value.copy(tmpV).sub(sunWorld).normalize();
    u.uDefR.value = defl.r * defl.magViz.cfg.nose;
  } else u.uDefR.value = 0;

  for (const b of magBodies) {
    const m = b.magViz;
    b.pivot.getWorldPosition(tmpV);
    const dToCam = tmpV.distanceTo(camera.position);
    const reach = b.r * m.cfg.nose;
    const vis = S.showWind && dToCam > reach * 1.25 && dToCam < reach * 30;
    // il guscio ha senso solo da fuori; linee di campo, fasce e aurore
    // restano visibili anche quando ci si avvicina al pianeta
    const near = S.showWind && dToCam < reach * 30;
    m.root.visible = vis;
    if (m.dip) { m.dip.visible = near; m.dip.scale.setScalar(b.r); }
    if (!vis && !near) continue;
    toSunV.copy(sunWorld).sub(tmpV).normalize();
    // il pivot non ruota, quindi gli assi locali coincidono con quelli del mondo
    m.root.quaternion.setFromUnitVectors(UP, toSunV);
    m.root.scale.setScalar(b.r);
  }
}

/* ════════════════════════════════════════════════════════════════════
   15. AVVIO
   ════════════════════════════════════════════════════════════════════ */

const ldFill = document.getElementById('ld-fill'), ldSt = document.getElementById('ld-st');
const yieldFrame = () => new Promise(r => setTimeout(r, 0));

async function boot() {
  const mobile = Math.min(innerWidth, innerHeight) < 700 || (navigator.maxTouchPoints || 0) > 1 && innerWidth < 1100;
  if (mobile) { S.quality = 'med'; document.getElementById('quality').value = 'med'; }
  const RES_BIG = S.quality === 'low' ? 512 : 1024;
  const RES_MID = S.quality === 'low' ? 256 : 512;
  const RES_SML = 256;

  const steps = 1 + PLANETS.length + MOONS.length + 5;
  let done = 0;
  const step = async (label) => {
    ldSt.textContent = label;
    ldFill.style.width = ((done / steps) * 100).toFixed(1) + '%';
    await yieldFrame();
    done++;
  };

  await step('Accensione del Sole…');
  addSun();

  for (const p of PLANETS) {
    await step('Formazione di ' + p.name + '…');
    addPlanet(p, p.big || p.id === 'terra' ? RES_BIG : p.radius > 1500 ? RES_MID : RES_SML);
  }
  for (const m of MOONS) {
    await step('Cattura di ' + m.name + '…');
    addMoon(m, m.radius > 1200 ? RES_MID : RES_SML);
  }

  for (const b of bodies) {
    if (b.moons.length) b.shadowers = b.moons.slice().sort((x, y) => y.radius - x.radius).slice(0, 4);
  }

  for (const b of bodies) {
    if (MAGNETO[b.id]) b.magViz = buildMagnetosphere(b);
    else if (NO_FIELD.includes(b.id)) b.magViz = buildIonTail(b, b.atmo ? b.atmo.material.uniforms.uColor.value.getHex() : 0xffa060);
    if (b.magViz) { b.magViz.root.visible = false; if (b.magViz.dip) b.magViz.dip.visible = false; }
  }
  wind = makeWind(S.quality === 'low' ? 7000 : S.quality === 'med' ? 14000 : 26000);
  wind.visible = S.showWind;
  scene.add(wind);

  await step('Rintracciamento delle sonde…');
  addProbes();
  shadowBodies = bodies.filter(b => b.mesh && b.mesh.material.userData.u);
  magBodies    = bodies.filter(b => b.magViz);
  orbitBodies  = bodies.filter(b => b.orbitLine);

  await step('Accensione delle stelle…');
  stars = makeStars(S.quality === 'low' ? 10000 : S.quality === 'med' ? 20000 : 36000);
  scene.add(stars);

  await step('Soffio del vento solare…');

  await step('Semina della fascia degli asteroidi…');
  belt = makeBelt({
    count: S.quality === 'low' ? 9000 : S.quality === 'med' ? 18000 : 34000,
    aMin: 2.06, aMax: 3.42, inc: 11, ecc: 0.14, size: 1.5, seed: 991,
    tint: [1.0, 0.88, 0.70], opacity: 0.40, gaps: [2.50, 2.82, 2.96, 3.27]
  });
  belt.visible = S.showBelt; scene.add(belt);

  kuiper = makeBelt({
    count: S.quality === 'low' ? 6000 : 14000,
    aMin: 30.2, aMax: 49.5, inc: 16, ecc: 0.18, size: 1.5, seed: 773,
    tint: [0.78, 0.86, 1.0], opacity: 0.3
  });
  kuiper.visible = S.showKuiper; scene.add(kuiper);

  await step('Composizione dell\'interfaccia…');
  for (const b of bodies) b.setScale();
  buildLabels();
  buildNav();
  for (const b of bodies) { if (b.orbitLine) b.orbitLine.visible = S.showOrbits; if (b.ring) b.ring.visible = S.showOrbits; }
  syncTrails();
  buildComposer();

  ldFill.style.width = '100%';
  ldSt.textContent = 'Pronto';
  await new Promise(r => setTimeout(r, 320));
  document.getElementById('loader').classList.add('gone');
  setTimeout(() => document.getElementById('loader').remove(), 1200);

  prevTarget.copy(controls.target);
  clock.start();
  tick();

  // utile per collaudo e per link diretti del tipo  …/index.html#saturno
  window.orrery = { select: id => select(byId[id], true), bodies, state: S, camera, controls };
  if (location.hash) { const b = byId[location.hash.slice(1)]; if (b) select(b, true); }
}

boot();
</script>
